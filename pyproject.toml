[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-learning-os"
version = "0.1.0"
description = "Local-first personal learning platform"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.58,<2",
    "PyYAML>=6,<7",
    "mistune>=3.1,<4",
    "jupyterlab>=4.4,<5",
  "pandas>=2.2,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
