      - {id: typing, text: Item을 직접 입력했다}
      - {id: email, text: 이메일 도구를 사용했다}
      - {id: stakeholders, text: 이해관계자의 의견을 들었다}
    correct_answers: [accountability]
    explanation: 의견 수렴은 필요하지만 PO는 요청을 문제·evidence·Goal에 따라 통합하고 결정해야 한다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: leadership-self-management-boundary
    lesson_id: product-owner-leadership
    skill_id: self-management
    topic: 자기관리
    difficulty: 3
    type: multiple_choice
    prompt: 자기관리 Scrum Team을 돕는 PO 행동을 모두 고르시오.
    options:
      - {id: outcome, text: 문제와 기대 outcome, 제약을 명확히 한다}
      - {id: rationale, text: ordering rationale를 투명하게 공유한다}
      - {id: assign, text: Developers 개인별 task와 방법을 배정한다}
      - {id: access, text: 고객과 evidence에 접근할 수 있게 한다}
    correct_answers: [outcome, rationale, access]
    explanation: 명확한 방향·evidence·접근은 자기관리를 지원하며 개인 작업 지시는 침해한다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: leadership-disagreement
    lesson_id: product-owner-leadership
    skill_id: product-ownership
    topic: 제품 의사결정
    difficulty: 4
    type: single_choice
    prompt: Developers와 PO가 기술 위험이 큰 가치 기회를 두고 의견이 다르다. 가장 전문적인 접근은?
    options:
      - {id: options, text: Goal, evidence, risk와 선택지를 함께 탐색하고 각 accountability에 맞게 결정한다}
      - {id: po-tech, text: PO가 가치 책임을 근거로 기술 해법도 단독 결정한다}
      - {id: dev-value, text: Developers가 기술 책임을 근거로 Product Backlog ordering도 단독 결정한다}
      - {id: avoid, text: 갈등을 피하려고 결정을 무기한 연기한다}
    correct_answers: [options]
    explanation: 협업해 trade-off를 투명하게 하되 가치 ordering과 기술 판단의 accountability를 존중한다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: leadership-organizational-respect
    lesson_id: product-owner-leadership
    skill_id: product-ownership
    topic: 조직과 PO
    difficulty: 4
    type: single_choice
    prompt: 임원들이 PO를 거치지 않고 Developers에게 Backlog 순서를 매일 바꾸라고 지시한다. 우선 개선할 것은?
    options:
      - {id: respect, text: 하나의 PO decision path와 Goal·ordering 기준을 조직적으로 존중하게 한다}
      - {id: hide, text: Developers가 지시를 PO에게 숨긴다}
      - {id: many-po, text: 임원 모두를 Product Owner로 지정한다}
      - {id: no-backlog, text: 충돌을 피하려고 Product Backlog를 없앤다}
    correct_answers: [respect]
    explanation: 조직이 PO 결정을 존중해야 투명한 하나의 ordering과 빠른 적응이 가능하다.
    source_ref: https://scrumguides.org/scrum-guide.html

  # 71-75 Integrated scenarios
  - id: scenario-vip-mid-sprint
    lesson_id: product-owner-scenario
    skill_id: product-ownership
    topic: Sprint Goal과 변경
    difficulty: 4
    type: single_choice
    prompt: Sprint 중 VIP 고객이 긴급 기능을 요구했지만 Sprint Goal은 여전히 가치 있다. PO의 첫 행동은?
    options:
      - {id: assess, text: 요청의 문제·가치·Goal 영향을 투명하게 하고 Developers와 scope 선택을 검토한다}
      - {id: insert, text: Developers에게 즉시 추가하라고 지시한다}
      - {id: cancel, text: 고객 요청만으로 Sprint를 취소한다}
      - {id: ignore, text: Sprint 중 요청은 기록조차 하지 않는다}
    correct_answers: [assess]
    explanation: Sprint Goal을 보호하면서 새로운 evidence와 scope를 PO와 Developers가 협력해 검사한다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: scenario-unfinished-demo
    lesson_id: product-owner-scenario
    skill_id: scrum-framework
    topic: Done과 투명성
    difficulty: 4
    type: single_choice
    prompt: 고객 반응을 얻기 위해 DoD 미충족 기능을 Sprint Review에서 완료 결과로 보여 달라는 요청이 왔다. 답은?
    options:
      - {id: not-increment, text: 완료 Increment로 제시하지 않고 다른 투명한 discovery 방법을 찾는다}
      - {id: show-done, text: 90% 완료라고 표시하면 Increment로 인정한다}
      - {id: lower, text: PO가 Review 직전에 DoD를 낮춘다}
      - {id: approve, text: 고객이 좋아하면 자동으로 Done이다}
    correct_answers: [not-increment]
    explanation: DoD 미충족 작업은 Increment가 아니다. Prototype 등 다른 발견물은 상태를 명확히 구분해야 한다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: scenario-metric-conflict
    lesson_id: product-owner-scenario
    skill_id: product-value
    topic: 가치 Evidence
    difficulty: 5
    type: multiple_choice
    prompt: 전환율은 상승했지만 해지율과 문의율도 악화됐다. 다음 행동으로 적절한 것을 모두 고르시오.
    options:
      - {id: segment, text: 고객 세그먼트별 결과와 정성 feedback을 검사한다}
      - {id: guardrail, text: guardrail을 포함해 가치 가설을 다시 평가한다}
      - {id: scale, text: 전환율만 보고 전 고객에게 즉시 확대한다}
      - {id: adapt, text: evidence에 따라 실험·Backlog를 변경하거나 중단한다}
    correct_answers: [segment, guardrail, adapt]
    explanation: 단일 지표가 아닌 실제 customer outcome과 부작용을 함께 검사해 투자 결정을 적응한다.
    source_ref: https://www.scrum.org/professional-scrum-competencies/managing-products-with-agility
  - id: scenario-solution-control
    lesson_id: product-owner-scenario
    skill_id: self-management
    topic: PO와 Developers 협업
    difficulty: 4
    type: single_choice
    prompt: 규제 준수 기능에서 PO가 구체 database schema를 지시한다. 더 나은 접근은?
    options:
      - {id: constraints, text: 규제 제약과 outcome을 명확히 하고 Developers가 해법을 설계하도록 협업한다}
      - {id: po-schema, text: PO가 가치 책임자이므로 schema를 최종 승인한다}
      - {id: no-context, text: Developers에게 규제 맥락을 주지 않고 맡긴다}
      - {id: stakeholder-code, text: 규제 담당자가 직접 코드를 지시한다}
    correct_answers: [constraints]
    explanation: PO는 문제·가치·제약을 투명하게 하고 Developers의 기술적 자기관리를 존중한다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: scenario-release-pressure
    lesson_id: product-owner-scenario
    skill_id: forecasting
    topic: 릴리스 Trade-off
    difficulty: 5
    type: single_choice
    prompt: 영업이 고정일에 전체 scope를 이미 약속했지만 85% confidence forecast는 절반 범위다. PO의 대응은?
    options:
      - {id: transparent-options, text: evidence와 위험을 공개하고 최소 가치 범위·단계적 release 선택지를 협상한다}
      - {id: hide, text: 약속일까지 위험을 숨긴다}
      - {id: quality, text: 전체 scope를 위해 DoD를 낮춘다}
      - {id: command, text: Developers에게 두 배 생산성을 지시한다}
    correct_answers: [transparent-options]
    explanation: 불확실성과 opportunity cost를 투명하게 하고 가치·품질을 지키는 선택지를 만든다.
    source_ref: https://www.scrum.org/professional-scrum-competencies/managing-products-with-agility

