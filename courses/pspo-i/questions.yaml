schema_version: 1
course_id: pspo-i
questions:
  # 01-05 Assessment blueprint
  - id: exam-format-count-time
    lesson_id: assessment-blueprint
    skill_id: product-ownership
    topic: 평가 구조
    difficulty: 1
    type: single_choice
    prompt: PSPO I의 공식 평가 구조로 옳은 것은 무엇인가?
    options:
      - {id: eighty-sixty, text: "80문항, 60분, 합격선 85%"}
      - {id: sixty-eighty, text: "60문항, 80분, 합격선 80%"}
      - {id: hundred-ninety, text: "100문항, 90분, 합격선 70%"}
    correct_answers: [eighty-sixty]
    explanation: 공식 안내는 80문항, 60분, 합격선 85%다. 이 코스는 안전 여유를 위해 90%를 학습 목표로 둔다.
    source_ref: https://www.scrum.org/assessments/professional-scrum-product-owner-i-certification
  - id: exam-official-formats
    lesson_id: assessment-blueprint
    skill_id: product-ownership
    topic: 평가 구조
    difficulty: 1
    type: multiple_choice
    prompt: PSPO I 공식 문항 형식에 포함되는 것을 모두 고르시오.
    options:
      - {id: mc, text: Multiple Choice}
      - {id: ma, text: Multiple Answer}
      - {id: tf, text: True/False}
      - {id: essay, text: 장문 Essay 채점}
    correct_answers: [mc, ma, tf]
    explanation: 공식 형식은 Multiple Choice, Multiple Answer, True/False이며 장문 Essay는 포함되지 않는다.
    source_ref: https://www.scrum.org/assessments/professional-scrum-product-owner-i-certification
  - id: exam-open-assessment-use
    lesson_id: assessment-blueprint
    skill_id: product-ownership
    topic: 시험 준비
    difficulty: 2
    type: single_choice
    prompt: Product Owner Open에서 여러 번 높은 점수를 받았다. 다음 준비로 가장 적절한 것은?
    options:
      - {id: ready, text: 공개 평가와 인증 시험 난도가 같으므로 즉시 응시한다}
      - {id: deepen, text: Scrum Guide와 공식 Focus Area를 시나리오에 적용하고 시간 제한 모의고사를 병행한다}
      - {id: dumps, text: 비공개 시험 기억 문항을 수집한다}
      - {id: memorize, text: 정답 위치만 암기한다}
    correct_answers: [deepen]
    explanation: Scrum.org는 Open Assessment가 전문 인증 시험과 같은 난도가 아니라고 안내한다. 개념 적용과 시간 훈련이 더 필요하다.
    source_ref: https://www.scrum.org/open-assessments
  - id: exam-required-vs-practice
    lesson_id: assessment-blueprint
    skill_id: scrum-framework
    topic: Scrum과 보조 관행
    difficulty: 2
    type: multiple_choice
    prompt: Scrum Guide가 필수로 요구하지 않는 보조 관행을 모두 고르시오.
    options:
      - {id: stories, text: User Stories}
      - {id: points, text: Story Points}
      - {id: product-backlog, text: Product Backlog}
      - {id: burndown, text: Burn-down chart}
    correct_answers: [stories, points, burndown]
    explanation: User Story, Story Point, Burn-down은 선택 가능한 기법이다. Product Backlog는 Scrum Artifact다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: exam-scenario-first-check
    lesson_id: assessment-blueprint
    skill_id: product-ownership
    topic: 문제 해결 전략
    difficulty: 2
    type: single_choice
    prompt: 역할이 뒤섞인 짧은 시험 시나리오를 읽었을 때 가장 먼저 확인할 것은?
    options:
      - {id: accountability, text: 누가 해당 결과에 accountable한가}
      - {id: longest, text: 가장 긴 선택지가 무엇인가}
      - {id: company, text: 현재 회사에서 관행적으로 누가 하는가}
      - {id: title, text: 등장인물 중 직급이 가장 높은 사람은 누구인가}
    correct_answers: [accountability]
    explanation: Scrum의 accountability와 목적을 먼저 식별하면 회사 관행이나 직급에 끌리지 않고 답을 판단할 수 있다.
    source_ref: https://scrumguides.org/scrum-guide.html

  # 06-10 Empiricism
  - id: empiricism-three-pillars
    lesson_id: scrum-theory-and-empiricism
    skill_id: empiricism
    topic: 경험주의
    difficulty: 1
    type: multiple_choice
    prompt: 경험주의의 세 기둥을 모두 고르시오.
    options:
      - {id: transparency, text: Transparency}
      - {id: inspection, text: Inspection}
      - {id: adaptation, text: Adaptation}
      - {id: prediction, text: 완전한 Prediction}
    correct_answers: [transparency, inspection, adaptation]
    explanation: Scrum 경험주의의 세 기둥은 투명성, 검사, 적응이다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: empiricism-hidden-churn
    lesson_id: scrum-theory-and-empiricism
    skill_id: empiricism
    topic: 투명성과 가치
    difficulty: 3
    type: single_choice
    prompt: 가입률은 상승했지만 해지율 악화를 보고서에서 숨겼다. 가장 먼저 훼손된 경험주의 기반은?
    options:
      - {id: transparency, text: Transparency}
      - {id: timebox, text: Sprint timebox}
      - {id: sizing, text: Item sizing}
      - {id: release, text: Release cadence}
    correct_answers: [transparency]
    explanation: 중요한 반대 evidence를 숨기면 검사가 잘못되고 적응도 왜곡된다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: empiricism-inspect-no-adapt
    lesson_id: scrum-theory-and-empiricism
    skill_id: empiricism
    topic: 검사와 적응
    difficulty: 3
    type: single_choice
    prompt: 팀은 매주 지표를 검토하지만 초기 roadmap을 한 번도 바꾸지 않는다. 가장 적절한 개선은?
    options:
      - {id: adapt, text: 관찰이 가정을 반박하면 Backlog와 계획을 신속히 적응한다}
      - {id: more-reports, text: 같은 보고서를 더 자주 만든다}
      - {id: freeze, text: 계획 준수를 위해 반대 지표를 제외한다}
      - {id: cancel-events, text: 검사가 불편하므로 Event를 없앤다}
    correct_answers: [adapt]
    explanation: 검사는 실제 적응으로 이어질 때 경험적 통제에 기여한다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: empiricism-complex-market
    lesson_id: scrum-theory-and-empiricism
    skill_id: empiricism
    topic: 복잡성
    difficulty: 3
    type: single_choice
    prompt: 고객 행동을 예측하기 어려운 신제품에서 위험을 줄이는 접근은?
    options:
      - {id: increment, text: 작은 Done Increment를 전달해 가정을 자주 검사한다}
      - {id: full-spec, text: 1년치 상세 범위를 먼저 동결한다}
      - {id: no-release, text: 모든 기능이 완성될 때까지 사용자를 만나지 않는다}
      - {id: opinion, text: 가장 높은 직급자의 직관만 따른다}
    correct_answers: [increment]
    explanation: 반복적·점진적 전달은 실제 경험으로 불확실성을 줄이고 빠른 적응을 가능하게 한다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: empiricism-scope-during-sprint
    lesson_id: scrum-theory-and-empiricism
    skill_id: empiricism
    topic: Sprint 적응
    difficulty: 4
    type: single_choice
    prompt: Sprint 중 예상과 다른 기술 학습이 생겼다. Scrum에 맞는 대응은?
    options:
      - {id: negotiate, text: Sprint Goal을 해치지 않도록 PO와 Developers가 범위를 재협상한다}
      - {id: fixed, text: 최초 Sprint Backlog는 절대 바꿀 수 없다}
      - {id: po-plan, text: PO가 Developers의 상세 계획을 다시 작성한다}
      - {id: lower-dod, text: 일정 유지를 위해 Definition of Done을 낮춘다}
    correct_answers: [negotiate]
    explanation: 학습에 따라 scope를 명확히 하고 재협상할 수 있지만 Sprint Goal과 품질은 보호해야 한다.
    source_ref: https://scrumguides.org/scrum-guide.html

  # 11-15 Scrum Values
  - id: values-five
    lesson_id: scrum-values-in-action
    skill_id: scrum-framework
    topic: Scrum Values
    difficulty: 1
    type: multiple_choice
    prompt: Scrum Values에 포함되는 것을 모두 고르시오.
    options:
      - {id: focus, text: Focus}
      - {id: openness, text: Openness}
      - {id: courage, text: Courage}
      - {id: utilization, text: Resource Utilization}
    correct_answers: [focus, openness, courage]
    explanation: Scrum Values는 Commitment, Focus, Openness, Respect, Courage다. 자원 활용률은 포함되지 않는다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: values-commitment-meaning
    lesson_id: scrum-values-in-action
    skill_id: scrum-framework
    topic: Commitment
    difficulty: 3
    type: single_choice
    prompt: Scrum Value인 Commitment를 가장 잘 설명한 것은?
    options:
      - {id: goals, text: 팀이 목표 달성과 서로의 지원에 헌신한다}
      - {id: fixed-scope, text: Sprint 시작 시 선택한 모든 Item을 무조건 완료한다}
      - {id: overtime, text: 예측이 틀리면 항상 초과 근무한다}
      - {id: individual, text: 각 개인의 작업량 계약을 지킨다}
    correct_answers: [goals]
    explanation: Commitment는 목표와 팀에 대한 헌신이지 고정 scope나 초과 근무 약속이 아니다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: values-courage-quality
    lesson_id: scrum-values-in-action
    skill_id: scrum-framework
    topic: Courage
    difficulty: 2
    type: single_choice
    prompt: 출시 압박 속에서 보안 기준 미충족을 공개하고 Done이 아니라고 말하는 행동과 가장 가까운 Value는?
    options:
      - {id: courage, text: Courage}
      - {id: focus, text: Focus}
      - {id: respect, text: Respect}
      - {id: forecasting, text: Forecasting}
    correct_answers: [courage]
    explanation: 불편한 사실을 말하고 옳은 품질 판단을 지키는 데 courage가 필요하다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: values-respect-expertise
    lesson_id: scrum-values-in-action
    skill_id: scrum-framework
    topic: Respect
    difficulty: 3
    type: multiple_choice
    prompt: Respect를 실제로 보여 주는 행동을 모두 고르시오.
    options:
      - {id: tech, text: Developers가 구현 방법을 결정할 전문성을 존중한다}
      - {id: value, text: PO의 가치 ordering accountability를 존중한다}
      - {id: avoid, text: 갈등을 피하려고 위험을 숨긴다}
      - {id: assign, text: PO가 개인별 작업을 일방 배정한다}
    correct_answers: [tech, value]
    explanation: 서로의 accountability와 전문성을 존중하는 것이 핵심이며 위험 은폐나 미세 관리는 아니다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: values-openness-forecast
    lesson_id: scrum-values-in-action
    skill_id: scrum-framework
    topic: Openness
    difficulty: 3
    type: single_choice
    prompt: 출시 forecast의 불확실성이 커졌다. Openness에 가장 맞는 PO의 행동은?
    options:
      - {id: expose, text: 가정과 범위, 신뢰 수준, 다음 갱신 시점을 공개한다}
      - {id: certainty, text: 신뢰를 위해 단일 날짜를 확정처럼 발표한다}
      - {id: hide, text: 이해관계자가 묻기 전까지 위험을 숨긴다}
      - {id: blame, text: Developers의 개인 성과 문제로 돌린다}
    correct_answers: [expose]
    explanation: 불확실성과 근거를 투명하게 공개해야 함께 검사하고 적응할 수 있다.
    source_ref: https://scrumguides.org/scrum-guide.html

  # 16-20 Scrum Team and self-management
  - id: team-po-accountability
    lesson_id: scrum-team-accountabilities
    skill_id: product-ownership
    topic: Product Owner 책임
    difficulty: 2
    type: multiple_choice
    prompt: Product Owner의 효과적인 Product Backlog 관리 책임에 포함되는 것을 모두 고르시오.
    options:
      - {id: goal, text: Product Goal 개발과 명시적 소통}
      - {id: ordering, text: Product Backlog Item 정렬}
      - {id: tech-task, text: 개인별 기술 작업 배정}
      - {id: transparent, text: Backlog가 투명하고 이해되도록 보장}
    correct_answers: [goal, ordering, transparent]
    explanation: PO는 Goal, Item 명확성·정렬, Backlog 투명성에 accountable하다. 개인 작업 배정은 자기관리를 침해한다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: team-delegate-remains-accountable
    lesson_id: scrum-team-accountabilities
    skill_id: product-ownership
    topic: 위임과 책임
    difficulty: 3
    type: single_choice
    prompt: PO가 분석가에게 Backlog Item 초안 작성을 맡겼다. 결과에 대한 accountability는 누구에게 남는가?
    options:
      - {id: po, text: Product Owner}
      - {id: analyst, text: 분석가}
      - {id: sm, text: Scrum Master}
      - {id: committee, text: 이해관계자 위원회}
    correct_answers: [po]
    explanation: PO는 Backlog 관리 작업을 위임할 수 있지만 accountability는 계속 PO에게 남는다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: team-sizing-owner
    lesson_id: scrum-team-accountabilities
    skill_id: self-management
    topic: Sizing
    difficulty: 2
    type: single_choice
    prompt: Product Backlog Item의 크기를 최종적으로 산정할 책임은 누구에게 있는가?
    options:
      - {id: developers, text: 일을 수행할 Developers}
      - {id: po, text: Product Owner 단독}
      - {id: sm, text: Scrum Master 단독}
      - {id: sales, text: 영업 책임자}
    correct_answers: [developers]
    explanation: 실제 일을 수행할 Developers가 sizing에 책임지며 PO는 이해와 trade-off를 돕는다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: team-daily-scrum-owner
    lesson_id: scrum-team-accountabilities
    skill_id: self-management
    topic: Daily Scrum
    difficulty: 2
    type: single_choice
    prompt: Daily Scrum의 주된 참여자와 목적을 바르게 설명한 것은?
    options:
      - {id: developers, text: Developers가 Sprint Goal 진척을 검사하고 계획을 적응한다}
      - {id: po-report, text: Developers가 PO에게 개인 상태를 보고한다}
      - {id: sm-assign, text: Scrum Master가 당일 작업을 배정한다}
      - {id: stakeholder, text: 이해관계자가 Increment를 승인한다}
    correct_answers: [developers]
    explanation: Daily Scrum은 Developers가 자기관리하며 Sprint Goal을 향한 계획을 적응하는 15분 Event다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: team-cancel-sprint
    lesson_id: scrum-team-accountabilities
    skill_id: product-ownership
    topic: Sprint 취소
    difficulty: 4
    type: single_choice
    prompt: 규제 변화로 Sprint Goal이 더 이상 가치가 없게 됐다. Sprint를 취소할 권한은 누구에게 있는가?
    options:
      - {id: po, text: Product Owner}
      - {id: developers, text: Developers 다수결}
      - {id: sm, text: Scrum Master}
      - {id: sponsor, text: 후원자 단독}
    correct_answers: [po]
    explanation: Sprint Goal이 obsolete해지면 Product Owner만 Sprint를 취소할 권한이 있다.
    source_ref: https://scrumguides.org/scrum-guide.html

  # 21-25 Scrum Events
  - id: events-sprint-container
    lesson_id: scrum-events
    skill_id: scrum-framework
    topic: Sprint
    difficulty: 1
    type: single_choice
    prompt: 다른 Scrum Events를 담는 container 역할을 하는 Event는?
    options:
      - {id: sprint, text: Sprint}
      - {id: review, text: Sprint Review}
      - {id: planning, text: Sprint Planning}
      - {id: retro, text: Sprint Retrospective}
    correct_answers: [sprint]
    explanation: Sprint는 아이디어를 가치로 전환하는 한 달 이하의 고정 길이 Event이며 다른 Events를 담는다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: events-planning-topics
    lesson_id: scrum-events
    skill_id: scrum-framework
    topic: Sprint Planning
    difficulty: 2
    type: multiple_choice
    prompt: Sprint Planning에서 다루는 공식 주제를 모두 고르시오.
    options:
      - {id: why, text: 이 Sprint가 왜 가치 있는가}
      - {id: what, text: 이번 Sprint에 무엇을 할 수 있는가}
      - {id: how, text: 선택한 일을 어떻게 수행할 것인가}
      - {id: rating, text: 개인별 성과 등급은 무엇인가}
    correct_answers: [why, what, how]
    explanation: Sprint Planning은 Why, What, How 세 주제를 다루며 개인 평가 회의가 아니다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: events-review-purpose
    lesson_id: scrum-events
    skill_id: stakeholder-collaboration
    topic: Sprint Review
    difficulty: 3
    type: single_choice
    prompt: Sprint Review를 기능 시연과 승인만으로 진행하고 있다. 가장 중요한 개선은?
    options:
      - {id: inspect-adapt, text: 결과와 환경 변화를 이해관계자와 검사하고 미래 적응을 결정한다}
      - {id: signoff, text: PO의 완료 승인 서명을 추가한다}
      - {id: status, text: 개인별 작업 시간을 보고한다}
      - {id: retro, text: 팀 내부 process 개선만 논의한다}
    correct_answers: [inspect-adapt]
    explanation: Sprint Review의 목적은 Sprint 결과를 검사하고 향후 적응을 결정하는 것이다.
    source_ref: https://scrumguides.org/scrum-guide.html
  - id: events-retro-purpose
    lesson_id: scrum-events
    skill_id: self-management
    topic: Sprint Retrospective
    difficulty: 2
    type: single_choice
    prompt: Sprint Retrospective의 핵심 목적은?
    options:
      - {id: effectiveness, text: 품질과 효과성을 높일 방법을 계획한다}
      - {id: backlog-order, text: PO의 Backlog ordering을 승인한다}
      - {id: release-gate, text: Increment release를 허가한다}
      - {id: customer-demo, text: 고객에게 기능을 판매한다}
    correct_answers: [effectiveness]
