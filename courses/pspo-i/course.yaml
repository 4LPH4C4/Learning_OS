        content_path: lessons/product-value-and-evidence.md
        language: ko
        required: true
        skills: [product-value, empiricism]
      - id: customers-stakeholders-discovery
        title: 고객 발견과 이해관계자 협업
        type: markdown
        duration_minutes: 55
        content_path: lessons/customers-stakeholders-discovery.md
        language: ko
        required: true
        skills: [stakeholder-collaboration, product-value]
  - id: backlog-value-flow
    title: Product Backlog으로 가치 흐름 만들기
    order: 5
    lessons:
      - id: product-backlog-management
        title: Product Backlog 관리의 책임
        type: markdown
