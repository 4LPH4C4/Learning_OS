schema_version: 1
id: pspo-i
title: PSPO I — Professional Product Ownership
description: Scrum.org PSPO I 공식 범위를 완주하고, 제품 비전·가치 검증·백로그·이해관계자 협업을 실제 제품 운영에 적용하는 과정
category: product-management
source_type: local
status: active
glossary_path: glossary.yaml
schedule:
  target_date: 2026-10-04
  priority: 100
  estimated_hours: 18
  weekly_target_hours: 4.5
prerequisites:
  - Scrum Guide를 읽을 수 있는 수준의 영어 독해력
  - 제품 또는 서비스 개발의 기본 협업 경험
skills:
  - scrum-framework
  - empiricism
  - product-ownership
  - product-strategy
  - product-value
  - product-backlog-management
  - stakeholder-collaboration
  - forecasting
  - self-management
content_sources:
  - id: local-content
    type: local
    base_path: .
completion_criteria:
  type: all_required_lessons
quiz_settings:
  mock_exam:
    question_count: 80
    duration_minutes: 60
    target_score: 90
modules:
  - id: assessment-orientation
    title: 시험 이해와 학습 전략
    order: 1
    lessons:
      - id: assessment-blueprint
        title: PSPO I 평가 구조와 합격 전략
        type: markdown
        duration_minutes: 35
        study_steps:
          - label: 공식 평가 구조 대조
            duration_minutes: 7
            outcome: 문항 수와 합격 기준을 공식 출처에서 확인한다.
          - label: Focus Area와 공식 용어 비교
            duration_minutes: 8
            outcome: Scrum Guide의 용어를 자기 말로 바꿔 설명한다.
          - label: 상황형 판단과 자가점검
            duration_minutes: 10
            outcome: 선택지별 판단 근거를 말로 설명한다.
          - label: 판단 근거 다시 검토
            duration_minutes: 5
            outcome: 회사 관행과 Scrum의 요구를 구분한다.
          - label: 60초 설명과 요약 기록
            duration_minutes: 5
            outcome: 핵심 세 문장과 남은 질문을 Note에 남긴다.
        content_path: lessons/assessment-blueprint.md
        language: ko
        required: true
        skills: [product-ownership]
  - id: scrum-foundations
    title: Scrum의 이론과 책임
    order: 2
    lessons:
      - id: scrum-theory-and-empiricism
        title: Scrum Theory와 경험주의
        type: markdown
        duration_minutes: 45
        content_path: lessons/scrum-theory-and-empiricism.md
        language: ko
        required: true
        skills: [scrum-framework, empiricism]
      - id: scrum-values-in-action
        title: Scrum Values를 행동으로 옮기기
        type: markdown
        duration_minutes: 35
        content_path: lessons/scrum-values-in-action.md
        language: ko
        required: true
        skills: [scrum-framework, product-ownership]
      - id: scrum-team-accountabilities
        title: Scrum Team의 책임과 자기관리
        type: markdown
        duration_minutes: 45
        content_path: lessons/scrum-team-accountabilities.md
        language: ko
        required: true
        skills: [scrum-framework, self-management]
  - id: scrum-events-artifacts
    title: Events, Artifacts, Commitments
    order: 3
    lessons:
      - id: scrum-events
        title: Scrum Events와 검사·적응
        type: markdown
        duration_minutes: 50
        content_path: lessons/scrum-events.md
        language: ko
        required: true
        skills: [scrum-framework, empiricism]
      - id: artifacts-commitments-done
        title: Artifacts, Commitments, Definition of Done
        type: markdown
        duration_minutes: 50
        content_path: lessons/artifacts-commitments-done.md
        language: ko
        required: true
        skills: [scrum-framework, product-backlog-management]
  - id: product-direction-value
    title: 제품 방향과 가치
    order: 4
    lessons:
      - id: product-vision-strategy-goal
        title: Product Vision, Strategy, Product Goal
        type: markdown
        duration_minutes: 55
        content_path: lessons/product-vision-strategy-goal.md
        language: ko
        required: true
        skills: [product-strategy, product-ownership]
      - id: product-value-and-evidence
        title: 제품 가치와 증거 기반 의사결정
        type: markdown
