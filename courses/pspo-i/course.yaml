  - id: forecasting-delivery
    title: 예측, 릴리스, 학습
    order: 6
    lessons:
      - id: forecasting-release-planning
        title: 경험적 예측과 릴리스 계획
        type: markdown
        duration_minutes: 55
        content_path: lessons/forecasting-release-planning.md
        language: ko
        required: true
        skills: [forecasting, empiricism]
      - id: sprint-review-adaptation
        title: Sprint Review로 제품 방향 적응하기
        type: markdown
        duration_minutes: 45
        content_path: lessons/sprint-review-adaptation.md
        language: ko
        required: true
        skills: [stakeholder-collaboration, empiricism]
  - id: professional-practice
    title: Professional Product Owner 실전
    order: 7
    lessons:
      - id: product-owner-leadership
        title: 권한, 리더십, 자기관리 팀
