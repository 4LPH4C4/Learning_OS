category: language
source_type: local
status: active
glossary_path: glossary.yaml
schedule:
  target_date: null
  priority: 80
  estimated_hours: 26
  weekly_target_hours: 3
prerequisites: []
skills:
  - english-reading
  - english-writing
  - english-speaking
  - english-listening
  - english-interaction
  - english-language-control
content_sources:
