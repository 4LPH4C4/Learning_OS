    lesson_id: placement-assessment
    question_set: placement
    question_count: 36
    duration_minutes: 35
    level_pass_score: 60
    cumulative_pass_score: 65
    result_label: CEFR 권장 시작 등급
    disclaimer: 이 진단은 읽기·어휘·문법·상황 판단 중심의 학습 배치용 평가이며 공인 CEFR 인증이 아니다. 듣기와 말하기는 별도 수행 과제로 확인해야 한다.
    levels:
      - {id: a1, label: CEFR A1, min_score: 0}
      - {id: a2, label: CEFR A2, min_score: 17}
      - {id: b1, label: CEFR B1, min_score: 34}
      - {id: b2, label: CEFR B2, min_score: 51}
      - {id: c1, label: CEFR C1, min_score: 68}
      - {id: c2, label: CEFR C2, min_score: 84}
