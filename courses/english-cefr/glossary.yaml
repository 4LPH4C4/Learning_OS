version: 1
course_id: english-cefr
terms:
  - id: cefr
    name: CEFR
    aliases: [유럽공통언어참조기준, Common European Framework of Reference for Languages]
    short_definition: 언어 능력을 실제 수행 중심으로 기술하는 A1부터 C2까지의 공통 참조 체계다.
    explanation: |
      CEFR은 특정 시험이나 교재가 아니라 학습자가 듣기·읽기·말하기·쓰기·상호작용에서 무엇을 할 수 있는지를 설명하는 틀이다. 한 영역의 능력이 다른 영역과 다를 수 있으므로 하나의 점수만으로 전체 언어 능력을 단정하면 안 된다.
    example: B1 학습자는 익숙한 주제의 표준적인 입력에서 핵심을 이해하고 여행 중 생기는 대부분의 상황을 처리하는 것을 목표로 한다.
    related_terms: [can-do-descriptor, communicative-language-competence]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/introduction-and-context
  - id: can-do-descriptor
    name: Can-do descriptor
    aliases: [할 수 있다 기술문, 수행 기술문]
    short_definition: 학습자가 실제 상황에서 수행할 수 있는 행동으로 언어 능력을 표현한 문장이다.
    explanation: 지식 항목을 얼마나 외웠는지가 아니라 목적이 있는 과업을 얼마나 독립적이고 정확하게 수행하는지를 관찰한다.
    example: 일정 변경을 설명하고 상대방에게 가능한 대안을 물을 수 있다.
    related_terms: [cefr]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: communicative-language-competence
    name: 의사소통 언어 능력
    aliases: [communicative language competence]
    short_definition: 언어 형식, 사회적 적절성, 담화 구성 능력을 함께 사용해 목적을 달성하는 능력이다.
    explanation: 문법적으로 맞는 문장만으로 충분하지 않다. 상황에 맞는 표현을 선택하고 여러 문장을 연결하며 상대의 반응에 맞춰 조정해야 한다.
    example: 고객에게 문제를 설명할 때 정확한 시제뿐 아니라 정중한 요청과 명확한 정보 순서를 사용한다.
    related_terms: [register, cohesion]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/introduction-and-context
  - id: receptive-skills
    name: 수용 기능
    aliases: [reception, receptive skills, 이해 기능]
    short_definition: 듣거나 읽은 언어를 목적에 맞게 이해하는 기능이다.
    explanation: 모든 단어를 번역하는 것보다 주제, 핵심 주장, 세부 정보, 화자의 태도와 함의를 필요한 수준만큼 포착하는 것이 중요하다.
    example: 열차 안내에서 출발 시각과 플랫폼 변경 정보를 찾아낸다.
    related_terms: [productive-skills, inference]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: productive-skills
    name: 산출 기능
    aliases: [production, productive skills, 표현 기능]
    short_definition: 말이나 글로 의미를 조직해 전달하는 기능이다.
    explanation: 정확성뿐 아니라 목적에 맞는 내용 선택, 연결성, 유창성, 청자·독자에 맞춘 표현이 함께 평가된다.
    example: 프로젝트 지연의 원인과 다음 조치를 2분 동안 구조적으로 설명한다.
    related_terms: [receptive-skills]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: interaction
    name: 상호작용
    aliases: [interaction, spoken interaction, written interaction]
    short_definition: 상대와 차례를 주고받으며 공동의 의미와 결과를 만들어 가는 언어 활동이다.
    explanation: 질문하기, 확인하기, 오해를 고치기, 발언권을 얻고 넘기기, 상대의 관점을 반영하는 전략을 포함한다.
    example: 회의에서 제안을 요약해 확인한 뒤 우려 사항을 질문하고 타협안을 제시한다.
    related_terms: [repair-strategy, mediation]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: mediation
    name: 언어 중재
    aliases: [mediation]
    short_definition: 정보나 개념을 다른 사람이 이해하고 함께 사용할 수 있도록 재구성하고 연결하는 활동이다.
    explanation: 단순 번역을 넘어 복잡한 정보를 요약하고, 전문 용어를 풀어 설명하며, 서로 다른 관점 사이의 공통점을 만드는 일을 포함한다.
    example: 기술 보고서의 핵심 위험을 비전문가에게 쉬운 말과 예시로 설명한다.
    related_terms: [interaction]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: register
    name: 격식 수준
    aliases: [register, 문체 격식]
    short_definition: 관계·목적·매체에 따라 표현의 격식과 어조를 조절하는 방식이다.
    explanation: 친구에게 보내는 메시지와 고객에게 보내는 공식 메일은 같은 내용이어도 어휘, 완곡성, 문장 구조가 달라야 한다.
    example: Send me the file. 대신 Could you please send me the file by noon?을 쓴다.
    related_terms: [communicative-language-competence]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/introduction-and-context
  - id: cohesion
    name: 응집성
    aliases: [cohesion]
    short_definition: 지시어·접속어·어휘 반복과 대체로 문장들이 표면적으로 연결되는 성질이다.
    explanation: however, this result, the former 같은 장치가 독자가 정보 관계를 추적하도록 돕는다. 논리 구조 자체인 coherence와 구별한다.
    example: The trial was small. Nevertheless, its results justify a larger study.
    related_terms: [coherence]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: coherence
    name: 일관성
    aliases: [coherence]
    short_definition: 글이나 말의 전체 아이디어가 목적에 맞는 논리적 구조를 이루는 성질이다.
    explanation: 연결어가 많아도 주장과 근거의 관계가 불분명하면 일관성이 낮다. 정보의 순서, 단락의 역할, 독자가 따라갈 수 있는 추론이 핵심이다.
    example: 문제 제시, 원인 분석, 대안 비교, 권고 순으로 보고서를 구성한다.
    related_terms: [cohesion]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: collocation
    name: 연어
    aliases: [collocation]
    short_definition: 원어민 사용에서 관습적으로 함께 나타나는 단어 조합이다.
    explanation: 의미는 통하더라도 조합이 어색하면 자연스러움과 정확성이 낮아진다. 개별 단어보다 덩어리로 익히는 것이 좋다.
    example: make a decision, heavy rain, raise an objection
    related_terms: [lexical-range]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: inference
    name: 추론
    aliases: [inference, 함의 추론]
    short_definition: 명시되지 않은 의미를 문맥·어조·배경 정보에서 합리적으로 도출하는 과정이다.
    explanation: 고급 읽기와 듣기에서는 사실뿐 아니라 필자의 태도, 발언의 목적, 전제와 완곡한 반대를 파악해야 한다.
    example: That's one way to look at it.이 맥락에 따라 유보적인 반대일 수 있음을 알아챈다.
    related_terms: [receptive-skills, hedging]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: hedging
    name: 완화 표현
    aliases: [hedging, hedge]
    short_definition: 주장의 확실성이나 강도를 조절해 신중함과 예의를 나타내는 표현 방식이다.
    explanation: may, appears to, to some extent 같은 표현은 책임을 회피하는 장치가 아니라 증거 수준을 정확히 나타낼 수 있다.
    example: The policy may have contributed to the decline, although the evidence remains limited.
    related_terms: [register, inference]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: repair-strategy
    name: 의사소통 복구 전략
    aliases: [repair strategy, clarification strategy]
    short_definition: 이해하거나 표현하는 데 문제가 생겼을 때 질문·바꿔 말하기·확인으로 대화를 회복하는 방법이다.
    explanation: 모르는 단어 하나 때문에 대화를 멈추지 않고 의미를 설명하거나 상대에게 반복과 구체화를 요청하는 능력이다.
    example: Do you mean the deadline is fixed, or is there some flexibility?
    related_terms: [interaction]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: lexical-range
    name: 어휘 범위
    aliases: [lexical range, vocabulary range]
    short_definition: 주제와 목적에 맞게 사용할 수 있는 단어와 표현의 폭이다.
    explanation: 어려운 단어의 수보다 같은 생각을 반복 없이 정확히 표현하고 분야별 의미 차이를 통제할 수 있는지가 중요하다.
    example: good 대신 beneficial, convincing, enjoyable처럼 맥락에 맞는 표현을 구분한다.
    related_terms: [collocation]
    source_url: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
