    type: single_choice
    prompt: |-
      After a supposedly simple update causes a day-long outage, an engineer says, "Well, that was wonderfully straightforward." What is the engineer most likely doing?
    options:
      - {id: literal-praise, text: Literally praising how easy the update was}
      - {id: requesting, text: Asking for written instructions}
