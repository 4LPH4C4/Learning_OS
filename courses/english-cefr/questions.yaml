  - id: placement-c2-05
    lesson_id: placement-assessment
    skill_id: english-writing
    topic: 정확한 편집
    difficulty: 5
    level: c2
    sets: [placement]
    type: single_choice
    prompt: |-
      Original: "Only the regional managers who completed the audit received the bonus." Which paraphrase preserves the most likely scope?
    options:
      - {id: all-managers, text: "Every regional manager received the bonus, whether or not they completed the audit."}
      - {id: only-bonus, text: The managers received nothing except a bonus.}
      - {id: no-one, text: No regional manager completed the audit or received a bonus.}
      - {id: restrict-managers, text: "Among regional managers, the bonus went exclusively to those who had completed the audit."}
    correct_answers: [restrict-managers]
    explanation: only는 보너스를 받은 지역 관리자의 범위를 감사 완료자로 제한한다.
