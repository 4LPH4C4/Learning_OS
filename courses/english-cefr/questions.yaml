    prompt: What is the most precise interpretation of "The study failed to demonstrate that the treatment was effective"?
    options:
      - {id: proven-harmful, text: The treatment was proven harmful.}
      - {id: proven-useless, text: The treatment was definitively proven ineffective.}
      - {id: no-study, text: No study was conducted.}
      - {id: insufficient-evidence, text: The study did not provide sufficient evidence of effectiveness; this does not itself prove ineffectiveness.}
    correct_answers: [insufficient-evidence]
    explanation: 효과를 입증하지 못했다는 말은 효과가 없음을 입증했다는 말과 논리적으로 다르다.
