  - id: placement-c2-06
    lesson_id: placement-assessment
    skill_id: english-interaction
    topic: 갈등 중재
    difficulty: 5
    level: c2
    sets: [placement]
    type: single_choice
    prompt: Two teams use the word "optional" differently and blame each other. Which response best mediates the disagreement?
    options:
      - {id: blame, text: "One of you is obviously wrong, so decide who should apologize."}
      - {id: avoid, text: "Words never have stable meanings, so the issue cannot be resolved."}
      - {id: oversimplify, text: Optional always means unimportant.}
      - {id: mediate, text: "It seems one team understood the method as optional, while the other understood the entire requirement as optional. Let's confirm the intended scope before assigning responsibility."}
    correct_answers: [mediate]
    explanation: 두 해석을 중립적으로 정확히 재구성하고 책임 판단 전에 의미 범위를 확인하도록 한다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
