schema_version: 1
course_id: english-cefr
questions:
  - id: placement-a1-01
    lesson_id: placement-assessment
    skill_id: english-reading
    topic: 짧은 안내 이해
    difficulty: 1
    level: a1
    sets: [placement]
    type: single_choice
    prompt: "A shop sign says: 'Closed on Mondays.' When can you NOT visit the shop?"
    options:
      - {id: monday, text: Monday}
      - {id: tuesday, text: Tuesday}
      - {id: friday, text: Friday}
      - {id: saturday, text: Saturday}
    correct_answers: [monday]
    explanation: Closed on Mondays는 매주 월요일에 영업하지 않는다는 뜻이다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-a1-02
    lesson_id: placement-assessment
    skill_id: english-language-control
    topic: be동사
    difficulty: 1
    level: a1
    sets: [placement]
    type: single_choice
    prompt: Choose the correct sentence.
    options:
      - {id: correct, text: My friends are at school.}
      - {id: is, text: My friends is at school.}
      - {id: am, text: My friends am at school.}
      - {id: be, text: My friends be at school.}
    correct_answers: [correct]
    explanation: 복수 주어 friends에는 현재형 be동사 are를 쓴다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-a1-03
    lesson_id: placement-assessment
    skill_id: english-interaction
    topic: 기본 요청
    difficulty: 1
    level: a1
    sets: [placement]
    type: single_choice
    prompt: You did not hear a person's name. What is the most useful response?
    options:
      - {id: repeat, text: "Sorry, could you say your name again?"}
      - {id: not-valid, text: "No, I don't name."}
      - {id: later, text: Your name is later.}
      - {id: want, text: I want a name.}
    correct_answers: [repeat]
    explanation: 못 들은 정보를 정중하고 구체적으로 반복 요청하는 표현이다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: placement-a1-04
    lesson_id: placement-assessment
    skill_id: english-reading
    topic: 시간 정보
    difficulty: 1
    level: a1
    sets: [placement]
    type: single_choice
    prompt: "The email says: 'The class starts at 9:15 and ends at 10:00.' How long is the class?"
    options:
      - {id: forty-five, text: 45 minutes}
      - {id: fifteen, text: 15 minutes}
      - {id: one-hour, text: 1 hour}
      - {id: seventy-five, text: 75 minutes}
    correct_answers: [forty-five]
    explanation: 9시 15분부터 10시까지는 45분이다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-a1-05
    lesson_id: placement-assessment
    skill_id: english-language-control
    topic: 현재형
    difficulty: 1
    level: a1
    sets: [placement]
    type: single_choice
    prompt: Complete the sentence. "Mina ___ coffee every morning."
    options:
      - {id: drinks, text: drinks}
      - {id: drink, text: drink}
      - {id: drinking, text: drinking}
      - {id: drank, text: drank}
    correct_answers: [drinks]
    explanation: 3인칭 단수 주어 Mina의 반복되는 습관에는 현재형 drinks를 쓴다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-a1-06
    lesson_id: placement-assessment
    skill_id: english-interaction
    topic: 주문 표현
    difficulty: 1
    level: a1
    sets: [placement]
    type: single_choice
    prompt: Which sentence is appropriate when ordering at a café?
    options:
      - {id: like, text: "I'd like a small tea, please."}
      - {id: give, text: You give tea now.}
      - {id: tea-is, text: Tea is me.}
      - {id: take, text: I take you a tea.}
    correct_answers: [like]
    explanation: I'd like ... please는 기본적인 정중한 주문 표현이다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors

  - id: placement-a2-01
    lesson_id: placement-assessment
    skill_id: english-language-control
    topic: 과거형
    difficulty: 2
    level: a2
    sets: [placement]
    type: single_choice
    prompt: Complete the sentence. "We ___ the museum last Saturday."
    options:
      - {id: visited, text: visited}
      - {id: visit, text: visit}
      - {id: are-visiting, text: are visiting}
      - {id: have-visit, text: have visit}
    correct_answers: [visited]
    explanation: last Saturday처럼 끝난 과거 시점에는 과거형 visited가 알맞다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-a2-02
    lesson_id: placement-assessment
    skill_id: english-reading
    topic: 안내 조건
    difficulty: 2
    level: a2
    sets: [placement]
    type: single_choice
    prompt: "Notice: 'Please return all rented bikes before 7 p.m. Late returns cost €5.' What happens if you return a bike at 7:30?"
    options:
      - {id: fee, text: You pay an extra fee.}
      - {id: free, text: The rental is free.}
      - {id: new-bike, text: You receive another bike.}
      - {id: closed-all, text: The shop closes forever.}
    correct_answers: [fee]
    explanation: 7시 이후 반납은 late return이므로 5유로의 추가 비용이 발생한다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-a2-03
    lesson_id: placement-assessment
    skill_id: english-language-control
    topic: 비교급
    difficulty: 2
    level: a2
    sets: [placement]
    type: single_choice
    prompt: Choose the correct completion. "The bus is cheap, but the train is ___."
    options:
      - {id: faster, text: faster}
      - {id: more-fast, text: more fast}
      - {id: fastest-than, text: fastest than}
      - {id: fastly, text: fastly}
    correct_answers: [faster]
    explanation: 두 대상을 비교할 때 fast의 비교급 faster를 쓴다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-a2-04
    lesson_id: placement-assessment
    skill_id: english-interaction
    topic: 약속 조정
    difficulty: 2
    level: a2
    sets: [placement]
    type: single_choice
    prompt: Your friend writes, "Can we meet at six instead of five?" Which reply clearly accepts the change?
    options:
      - {id: vague, text: Five was a number.}
      - {id: accept, text: Sure. See you at six.}
      - {id: unrelated, text: I met her yesterday.}
      - {id: impossible, text: Six meets me.}
    correct_answers: [accept]
    explanation: 변경된 시각을 명시해 수락하므로 오해가 없다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: placement-a2-05
    lesson_id: placement-assessment
    skill_id: english-writing
    topic: 이유와 결과
    difficulty: 2
    level: a2
    sets: [placement]
    type: single_choice
    prompt: Choose the best connector. "It was raining, ___ we went to the indoor market."
    options:
      - {id: because, text: because}
      - {id: so, text: so}
      - {id: although, text: although}
      - {id: before, text: before}
    correct_answers: [so]
    explanation: 앞 문장이 원인이고 뒤 문장이 그 결과이므로 so가 알맞다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-a2-06
    lesson_id: placement-assessment
    skill_id: english-interaction
    topic: 교환 요청
    difficulty: 2
    level: a2
    sets: [placement]
    type: single_choice
    prompt: You received the wrong size shirt. Which sentence best explains the problem and asks for a solution?
    options:
      - {id: angry, text: This shop is a shirt.}
      - {id: exchange, text: "I ordered a medium, but this is a small. Could I exchange it?"}
      - {id: no-size, text: I never wear sizes.}
      - {id: only-fact, text: Medium is bigger than small.}
    correct_answers: [exchange]
    explanation: 주문 사실, 문제, 원하는 해결책을 짧고 정중하게 모두 전달한다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors

  - id: placement-b1-01
    lesson_id: placement-assessment
    skill_id: english-language-control
    topic: 조건문
    difficulty: 3
    level: b1
    sets: [placement]
    type: single_choice
    prompt: Complete the sentence. "If the weather improves tomorrow, we ___ the event outside."
    options:
      - {id: held, text: held}
      - {id: will-hold, text: will hold}
      - {id: would-held, text: would held}
      - {id: holding, text: holding}
    correct_answers: [will-hold]
    explanation: 실현 가능한 미래 조건은 if절 현재형과 주절 will + 동사원형으로 표현한다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-b1-02
    lesson_id: placement-assessment
    skill_id: english-reading
    topic: 이메일 목적
    difficulty: 3
    level: b1
    sets: [placement]
    type: single_choice
    prompt: |-
      Read the email: "I'm afraid the figures for March are incomplete because two regional reports arrived late. I can send a preliminary table today or the verified report on Thursday. Please let me know which you prefer." What is the writer mainly doing?
    options:
      - {id: resignation, text: Resigning from the job}
      - {id: choice, text: Explaining a delay and offering two options}
      - {id: celebration, text: Celebrating record sales}
      - {id: hiring, text: Asking to hire two employees}
    correct_answers: [choice]
    explanation: 지연 이유를 설명하고 오늘의 예비표와 목요일의 검증 보고서 중 선택을 요청한다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-b1-03
    lesson_id: placement-assessment
    skill_id: english-language-control
    topic: 사건의 시간 관계
    difficulty: 3
    level: b1
    sets: [placement]
    type: single_choice
    prompt: Choose the best completion. "When I arrived at the station, the last train ___."
    options:
      - {id: leaves, text: leaves already}
      - {id: had-left, text: had already left}
      - {id: has-leave, text: has already leave}
      - {id: is-left, text: is already left}
    correct_answers: [had-left]
    explanation: 도착보다 먼저 끝난 사건을 과거완료 had left로 나타낸다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-b1-04
    lesson_id: placement-assessment
    skill_id: english-interaction
    topic: 명료화 질문
    difficulty: 3
    level: b1
    sets: [placement]
    type: single_choice
    prompt: A colleague says, "Please finish the final version soon." You need a precise deadline. What should you ask?
    options:
      - {id: why-work, text: "Why is work working?"}
      - {id: deadline, text: "What time on which day do you need it?"}
      - {id: no-question, text: Soon is always soon.}
      - {id: unrelated, text: "Did you enjoy lunch?"}
    correct_answers: [deadline]
    explanation: 모호한 soon을 실제 날짜와 시각으로 구체화하는 질문이다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: placement-b1-05
    lesson_id: placement-assessment
    skill_id: english-writing
    topic: 의견 구성
    difficulty: 3
    level: b1
    sets: [placement]
    type: single_choice
    prompt: Which paragraph has the clearest opinion-reason-example structure?
    options:
      - {id: list, text: Hours are flexible. Focus is a noun. Morning comes before afternoon.}
      - {id: structured, text: "Flexible hours can improve focus because people work at their most productive times. For example, I complete writing tasks earlier in the morning."}
      - {id: repeat, text: It is good because it is good and good things are good.}
      - {id: unrelated, text: Offices have chairs. Yesterday was Tuesday.}
    correct_answers: [structured]
    explanation: 첫 문장이 의견과 이유를 제시하고 둘째 문장이 구체적인 예로 이를 뒷받침한다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: placement-b1-06
    lesson_id: placement-assessment
    skill_id: english-reading
    topic: 규정의 의무와 권고
    difficulty: 3
    level: b1
    sets: [placement]
    type: single_choice
    prompt: '"Visitors must wear an ID badge, and they should keep it visible at all times." Which statement is correct?'
    options:
      - {id: both-optional, text: Both actions are optional.}
      - {id: must, text: Wearing a badge is required; keeping it visible is recommended.}
      - {id: reverse, text: "A badge is recommended, but visibility is required."}
      - {id: forbidden, text: Visitors are forbidden to wear badges.}
    correct_answers: [must]
    explanation: must는 의무, should는 권고를 나타낸다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions

  - id: placement-b2-01
    lesson_id: placement-assessment
    skill_id: english-reading
    topic: 주장과 한계
    difficulty: 4
    level: b2
    sets: [placement]
    type: single_choice
    prompt: |-
      "The pilot reduced waiting times by 20 percent. However, it involved only two small clinics, so the results should not yet be generalized to the entire health system." What is the writer's position?
    options:
      - {id: total-failure, text: The pilot completely failed.}
      - {id: proven-everywhere, text: The method has been proven effective in every clinic.}
      - {id: promising-limited, text: The result is promising but the evidence is too limited for a broad conclusion.}
      - {id: no-change, text: Waiting times did not change.}
    correct_answers: [promising-limited]
    explanation: 필자는 개선 효과를 인정하면서 작은 표본 때문에 일반화를 유보한다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-b2-02
    lesson_id: placement-assessment
    skill_id: english-language-control
    topic: 가정법
    difficulty: 4
    level: b2
    sets: [placement]
    type: single_choice
    prompt: Complete the sentence. "Had we known about the shortage earlier, we ___ a different supplier."
    options:
      - {id: will-choose, text: will choose}
      - {id: choose, text: choose}
      - {id: would-have, text: would have chosen}
      - {id: had-choose, text: had choose}
    correct_answers: [would-have]
    explanation: 과거 사실과 반대인 조건은 Had + 주어 + 과거분사와 would have + 과거분사로 표현한다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-b2-03
    lesson_id: placement-assessment
    skill_id: english-writing
    topic: 공식 문체
    difficulty: 4
    level: b2
    sets: [placement]
    type: single_choice
    prompt: Which sentence is most appropriate in a formal report?
    options:
      - {id: slang, text: "The results are kinda cool, so let's just go for it."}
      - {id: chatty, text: "You know, testing might be a thing."}
      - {id: formal, text: The findings indicate that further testing is required before implementation.}
      - {id: vague, text: Stuff happened and things may change.}
    correct_answers: [formal]
    explanation: 객관적인 어휘와 명확한 다음 조건을 사용해 공식 보고서에 알맞다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: placement-b2-04
    lesson_id: placement-assessment
    skill_id: english-interaction
    topic: 회의 이견 표현
    difficulty: 4
    level: b2
    sets: [placement]
    type: single_choice
    prompt: Which response disagrees clearly while helping the discussion move forward?
    options:
      - {id: attack, text: "That's ridiculous, and there is nothing to discuss."}
      - {id: hidden, text: "Fine, whatever you say."}
      - {id: constructive, text: "I see the potential benefit, but the cost estimate seems incomplete. Could we review it before deciding?"}
      - {id: irrelevant, text: The meeting room has a large window.}
    correct_answers: [constructive]
    explanation: 상대의 관점을 인정하고 구체적인 우려와 다음 행동을 제시한다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: placement-b2-05
    lesson_id: placement-assessment
    skill_id: english-reading
    topic: 논증의 전제
    difficulty: 4
    level: b2
    sets: [placement]
    type: single_choice
    prompt: |-
      "Our competitors introduced four-day weeks and reported fewer resignations. We should do the same to retain our employees." Which assumption is necessary for the argument?
    options:
      - {id: all-identical, text: Every employee has exactly the same job.}
      - {id: no-cost, text: A four-day week can never have any cost.}
      - {id: comparable, text: The competitors' lower resignation rates are relevant to this company and may be linked to the schedule change.}
      - {id: competitors-lie, text: All competitor reports are false.}
    correct_answers: [comparable]
    explanation: 경쟁사의 경험을 적용하려면 조직이 비교 가능하고 변화가 결과와 관련 있다는 전제가 필요하다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: placement-b2-06
    lesson_id: placement-assessment
    skill_id: english-language-control
    topic: 연어
    difficulty: 4
    level: b2
    sets: [placement]
    type: single_choice
    prompt: Choose the natural collocation. "After reviewing the evidence, the committee ___ a decision."
    options:
      - {id: did, text: did}
      - {id: built, text: built}
      - {id: made, text: made}
      - {id: produced, text: produced}
    correct_answers: [made]
    explanation: 영어에서는 관습적으로 make a decision이라는 연어를 쓴다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors

  - id: placement-c1-01
    lesson_id: placement-assessment
    skill_id: english-reading
    topic: 간접적 태도
    difficulty: 5
    level: c1
    sets: [placement]
    type: single_choice
    prompt: |-
      "The proposal is not without merit, but its authors appear to have underestimated the practical burden on small organizations." Which best describes the writer's attitude?
    options:
      - {id: full-support, text: The writer supports every part without reservation.}
      - {id: no-view, text: The writer expresses no view at all.}
      - {id: qualified-criticism, text: The writer acknowledges some value but raises a significant reservation.}
      - {id: simple-praise, text: The writer praises the practical design.}
    correct_answers: [qualified-criticism]
    explanation: not without merit로 일부 가치를 인정하지만 underestimated로 핵심적인 유보를 나타낸다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-c1-02
    lesson_id: placement-assessment
    skill_id: english-language-control
    topic: 도치 구문
    difficulty: 5
    level: c1
    sets: [placement]
    type: single_choice
    prompt: Choose the grammatically correct sentence.
    options:
      - {id: wrong-one, text: Rarely the consequences have been examined so closely.}
      - {id: wrong-two, text: Rarely have been the consequences examine so closely.}
      - {id: inversion, text: Rarely have the consequences been examined so closely.}
      - {id: wrong-three, text: Rarely did the consequences been examined so closely.}
    correct_answers: [inversion]
    explanation: 부정 의미의 부사가 문두에 오면 조동사와 주어가 도치되며 현재완료 수동은 have ... been examined가 된다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
  - id: placement-c1-03
    lesson_id: placement-assessment
    skill_id: english-writing
    topic: 주장 강도
    difficulty: 5
    level: c1
    sets: [placement]
    type: single_choice
    prompt: A small observational study found a correlation. Which conclusion best matches the evidence?
    options:
      - {id: causal, text: The study proves beyond doubt that one factor causes the other.}
      - {id: universal, text: The result applies to every population in all circumstances.}
      - {id: cautious, text: "The findings suggest a possible association, although causal conclusions would require further research."}
      - {id: meaningless, text: Observational evidence can never provide any useful information.}
    correct_answers: [cautious]
    explanation: 자료의 설계와 규모에 맞게 연관 가능성은 인정하되 인과와 일반화를 유보한다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: placement-c1-04
    lesson_id: placement-assessment
    skill_id: english-reading
    topic: 담화 기능
    difficulty: 5
    level: c1
    sets: [placement]
    type: single_choice
    prompt: |-
      "Admittedly, the revised process requires more preparation. That initial investment, however, prevents substantially more rework later." What does "Admittedly" signal?
    options:
      - {id: final-rejection, text: A complete rejection of the revised process}
      - {id: time-order, text: The exact time at which preparation begins}
      - {id: quotation, text: A direct quotation from another writer}
      - {id: concession, text: A concession before the writer reinforces the main argument}
    correct_answers: [concession]
    explanation: 불리한 점을 먼저 인정한 뒤 however 이하에서 더 중요한 장점을 제시한다.
    source_ref: https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors
  - id: placement-c1-05
    lesson_id: placement-assessment
    skill_id: english-interaction
    topic: 전문적 즉석 대응
    difficulty: 5
    level: c1
    sets: [placement]
    type: single_choice
    prompt: You are asked for a number you do not have during a formal briefing. Which response is most appropriate?
    options:
      - {id: invent, text: "It is probably 92.7 percent, although I have no data."}
      - {id: dismiss, text: That question does not matter.}
      - {id: evade, text: "Numbers are just numbers, really."}
      - {id: scope-followup, text: "I don't have the verified figure with me. The trend is downward, and I can provide the exact number after the briefing."}
    correct_answers: [scope-followup]
    explanation: 확인되지 않은 수치를 만들지 않고 알려진 범위와 후속 조치를 명확히 구분한다.
