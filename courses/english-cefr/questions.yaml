  - id: placement-c2-02
    lesson_id: placement-assessment
    skill_id: english-writing
    topic: 복수 자료 종합
    difficulty: 5
    level: c2
    sets: [placement]
    type: single_choice
    prompt: Three studies agree on a short-term benefit but disagree about why it fades. Which sentence best synthesizes them?
    options:
      - {id: list, text: Study A exists. Study B exists. Study C also exists.}
      - {id: false-agreement, text: All three studies reach exactly the same conclusion about every issue.}
      - {id: unsupported, text: The benefit will certainly last forever.}
      - {id: synthesis, text: "While all three studies identify an initial benefit, they attribute its decline to different mechanisms, leaving the long-term explanation unresolved."}
    correct_answers: [synthesis]
    explanation: 공통 결과와 설명의 차이를 하나의 쟁점 구조 안에서 정확히 결합한다.
