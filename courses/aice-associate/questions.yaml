schema_version: 1
course_id: aice-associate
questions:
  - id: pandas-select-column
    lesson_id: pandas-first-steps
    skill_id: data-preprocessing
    topic: DataFrame 선택
    difficulty: 1
    type: single_choice
    prompt: DataFrame df에서 age 열만 Series로 선택하는 표현은 무엇인가?
    options:
      - {id: bracket, text: "df['age']"}
      - {id: row-index, text: "df.iloc['age']"}
      - {id: filter, text: df.filter_rows('age')}
      - {id: describe, text: df.describe('age')}
    correct_answers: [bracket]
    explanation: 대괄호에 열 이름을 넣으면 해당 열을 Series로 선택할 수 있다.
    source_ref: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.html
  - id: missing-values-strategy
    lesson_id: data-cleaning-checklist
    skill_id: data-quality
    topic: 결측치 처리
    difficulty: 2
    type: multiple_choice
    prompt: 결측치를 처리하기 전에 점검할 내용으로 적절한 것을 모두 고르시오.
    options:
      - {id: mechanism, text: 결측이 생긴 업무적 원인과 의미}
      - {id: proportion, text: 열별 결측 비율과 특정 그룹 편중 여부}
      - {id: fill-zero-always, text: 모든 결측을 무조건 0으로 대체}
      - {id: target-leakage, text: 처리 방식이 분석 목표의 정보를 미리 사용하지 않는지}
    correct_answers: [mechanism, proportion, target-leakage]
    explanation: 결측은 의미와 분포를 확인한 뒤 분석 목적에 맞춰 제거·대체·별도 범주화를 선택한다.
    source_ref: lessons/data-cleaning-checklist.md
    incorrect_explanations:
      fill-zero-always: 0은 실제 값의 의미를 바꿀 수 있고 편향을 만든다.
  - id: group-summary-choice
    lesson_id: pandas-basics-lab
    skill_id: data-visualization
    topic: 그룹 요약
    difficulty: 2
    type: single_choice
    prompt: 지역별 매출 평균을 비교하려면 어떤 pandas 흐름이 가장 알맞은가?
    options:
      - {id: groupby-mean, text: "df.groupby('region')['sales'].mean()"}
      - {id: sort-only, text: df.sort_values('region')}
      - {id: head-only, text: df.head()}
      - {id: rename, text: "df.rename(columns={'sales': 'region'})"}
    correct_answers: [groupby-mean]
    explanation: groupby로 지역별 그룹을 만들고 sales의 mean을 계산한다.
    source_ref: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.groupby.html
  - id: outlier-review
    lesson_id: data-cleaning-checklist
    skill_id: data-quality
    topic: 이상치 검토
    difficulty: 3
    type: multiple_choice
    prompt: 매출에 매우 큰 값이 발견됐을 때 올바른 초기 대응을 모두 고르시오.
    options:
      - {id: verify-source, text: 원천 기록과 단위를 확인한다}
      - {id: compare-context, text: 고객·기간 등 맥락별 분포와 비교한다}
      - {id: delete-immediately, text: 평균에서 멀면 즉시 삭제한다}
      - {id: record-decision, text: 유지·변환·제외 판단과 근거를 기록한다}
    correct_answers: [verify-source, compare-context, record-decision]
    explanation: 이상치는 오류일 수도 유효한 희귀 사례일 수도 있으므로 검증과 근거 기록이 먼저다.
    source_ref: lessons/data-cleaning-checklist.md
    incorrect_explanations:
      delete-immediately: 통계적으로 드물다는 이유만으로 오류라고 단정할 수 없다.
  - id: clean-dataframe-operation
    lesson_id: pandas-basics-lab
    skill_id: data-quality
    topic: 데이터 정제
    difficulty: 3
    type: short_answer
    prompt: 중복 행을 제거한 DataFrame을 반환하는 pandas 메서드 이름을 쓰시오.
    options: []
    correct_answers: [drop_duplicates]
    explanation: drop_duplicates()는 중복 행을 제거한 결과를 반환한다.
    source_ref: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.drop_duplicates.html
  - id: correlation-caution
    lesson_id: pandas-basics-lab
    skill_id: data-visualization
    topic: 기초 분석 해석
    difficulty: 4
    type: single_choice
    prompt: 두 변수의 상관관계가 높다는 사실만으로 인과관계를 단정할 수 없는 가장 중요한 이유는 무엇인가?
    options:
      - {id: confounding, text: 교란변수·역인과·표본 우연으로도 상관이 나타날 수 있다}
      - {id: correlation-proves, text: 상관계수가 높으면 원인과 결과가 자동으로 확정된다}
      - {id: no-analysis, text: 상관관계는 어떤 분석에도 사용할 수 없다}
      - {id: same-variable, text: 상관관계는 항상 같은 변수를 두 번 측정한 결과다}
    correct_answers: [confounding]
    explanation: 관측된 상관은 교란변수, 역인과, 표본 우연으로도 생길 수 있으므로 인과 주장을 별도 설계와 검증으로 확인해야 한다.
    source_ref: lessons/pandas-first-steps.md
  - id: csv-load-method
    lesson_id: python-environment-and-loading
    skill_id: data-quality
    topic: 데이터 로딩
    difficulty: 1
    type: single_choice
    prompt: CSV 파일을 DataFrame으로 읽는 기본 pandas 함수는 무엇인가?
    options: [{id: read-csv, text: pd.read_csv}, {id: open-json, text: pd.read_json}, {id: save-csv, text: df.to_csv}, {id: parse-date, text: pd.to_datetime}]
    correct_answers: [read-csv]
    explanation: pd.read_csv는 CSV를 읽어 DataFrame을 만든다.
    source_ref: https://pandas.pydata.org/docs/reference/api/pandas.read_csv.html
  - id: inspect-shape
    lesson_id: python-environment-and-loading
    skill_id: data-quality
    topic: 데이터 구조
    difficulty: 1
    type: multiple_choice
    prompt: 로딩 직후 데이터 구조를 점검하는 방법을 모두 고르시오.
    options: [{id: shape, text: df.shape}, {id: dtypes, text: df.dtypes}, {id: head, text: df.head()}, {id: train-now, text: 즉시 모델을 학습한다}]
    correct_answers: [shape, dtypes, head]
    explanation: 크기·자료형·샘플 행을 먼저 확인해야 해석 오류를 줄인다.
    source_ref: lessons/pandas-first-steps.md
  - id: duplicate-key-check
    lesson_id: data-schema-and-quality
    skill_id: data-quality
    topic: 품질 점검
    difficulty: 2
    type: single_choice
    prompt: 고객 ID가 관측 단위마다 하나여야 하는 데이터에서 중복을 확인하는 목적은 무엇인가?
    options: [{id: detect-duplicate, text: 중복 관측으로 인한 집계와 학습 편향을 발견한다}, {id: increase-rows, text: 행을 늘린다}, {id: scale, text: 스케일을 조정한다}, {id: encode, text: 문자를 인코딩한다}]
    correct_answers: [detect-duplicate]
    explanation: 중복 행은 특정 대상을 과대표집해 분석과 모델을 왜곡한다.
    source_ref: lessons/data-cleaning-checklist.md
  - id: date-conversion
    lesson_id: data-schema-and-quality
    skill_id: data-preprocessing
    topic: 타입 점검
    difficulty: 2
    type: short_answer
    prompt: 문자열 날짜 열을 pandas 날짜 타입으로 변환하는 함수 이름을 쓰시오.
    options: []
    correct_answers: [to_datetime]
    explanation: pd.to_datetime으로 날짜 파싱을 명시한다.
    source_ref: https://pandas.pydata.org/docs/reference/api/pandas.to_datetime.html
  - id: missing-group-bias
    lesson_id: missing-and-outlier-treatment
    skill_id: data-quality
    topic: 결측치 편향
    difficulty: 3
    type: single_choice
    prompt: 특정 지역에만 결측이 집중되어 있다면 평균 대체 전에 무엇을 해야 하는가?
    options: [{id: investigate, text: 지역별 결측 메커니즘과 업무 의미를 조사한다}, {id: zero, text: 모두 0으로 바꾼다}, {id: drop-all, text: 해당 지역을 모두 삭제한다}, {id: ignore, text: 결측을 무시한다}]
    correct_answers: [investigate]
    explanation: 결측의 편중은 대표성 편향을 만들 수 있어 원인 확인이 우선이다.
    source_ref: lessons/data-cleaning-checklist.md
  - id: iqr-outlier-rule
    lesson_id: missing-and-outlier-treatment
    skill_id: data-quality
    topic: 이상치
    difficulty: 2
    type: single_choice
    prompt: IQR 기반 이상치 후보의 일반적인 하한은 무엇인가?
    options: [{id: lower, text: Q1 - 1.5 × IQR}, {id: mean, text: 평균 - 표준편차}, {id: median, text: 중앙값}, {id: max, text: 최댓값}]
    correct_answers: [lower]
    explanation: 상자그림의 대표적인 후보 경계는 Q1-1.5IQR과 Q3+1.5IQR이다.
    source_ref: lessons/data-cleaning-checklist.md
  - id: one-hot-purpose
    lesson_id: encoding-and-scaling
    skill_id: data-preprocessing
    topic: 인코딩
    difficulty: 2
    type: single_choice
    prompt: 명목형 지역 열을 원-핫 인코딩하는 주된 이유는 무엇인가?
    options: [{id: numeric-columns, text: 범주를 숫자 크기 관계로 오해하지 않도록 별도 지시 변수로 만든다}, {id: fill-missing, text: 결측을 채운다}, {id: remove-outlier, text: 이상치를 제거한다}, {id: shuffle, text: 행을 섞는다}]
    correct_answers: [numeric-columns]
    explanation: 원-핫은 명목 범주에 임의의 순서를 부여하지 않는다.
    source_ref: https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.OneHotEncoder.html
  - id: scaler-fit-boundary
    lesson_id: encoding-and-scaling
    skill_id: data-preprocessing
    topic: 스케일링
    difficulty: 3
    type: single_choice
    prompt: StandardScaler를 fit해야 하는 데이터는 무엇인가?
    options: [{id: train-only, text: 학습 데이터}, {id: test-only, text: 테스트 데이터}, {id: all-before-split, text: split 전 전체 데이터}, {id: labels-only, text: 목표 레이블만}]
    correct_answers: [train-only]
    explanation: 테스트 분포를 미리 사용하면 누수이므로 학습 데이터 통계만 fit한다.
    source_ref: https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.StandardScaler.html
  - id: random-state-purpose
    lesson_id: leakage-and-reproducibility
    skill_id: ml-reproducibility
    topic: 재현성
    difficulty: 2
    type: single_choice
    prompt: train_test_split에 random_state를 고정하는 이유는 무엇인가?
    options: [{id: repeatable-split, text: 같은 코드가 같은 분할을 재현하게 한다}, {id: improve-score, text: 점수를 자동으로 높인다}, {id: remove-null, text: 결측을 제거한다}, {id: encode-target, text: 레이블을 인코딩한다}]
    correct_answers: [repeatable-split]
    explanation: 난수 시드를 고정하면 실험 비교가 가능하다.
    source_ref: https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.train_test_split.html
  - id: leakage-example
    lesson_id: leakage-and-reproducibility
    skill_id: ml-reproducibility
    topic: 데이터 누수
    difficulty: 4
    type: multiple_choice
    prompt: 데이터 누수의 사례를 모두 고르시오.
    options: [{id: future-column, text: 예측 시점 이후에 생성되는 열을 입력으로 사용}, {id: test-fit, text: 테스트까지 합쳐 스케일러를 fit}, {id: pipeline, text: Pipeline 안에서 학습 데이터로만 변환기를 fit}, {id: random-state, text: 난수 시드를 기록}]
    correct_answers: [future-column, test-fit]
    explanation: 미래 정보와 테스트 통계를 학습에 섞는 것이 누수다.
    source_ref: lessons/data-cleaning-checklist.md
  - id: stratify-use
    lesson_id: classification-and-regression
    skill_id: data-preprocessing
    topic: 데이터 분할
    difficulty: 3
    type: single_choice
    prompt: 불균형 분류에서 stratify=y를 사용하는 목적은 무엇인가?
    options: [{id: preserve-ratio, text: 분할 전후 클래스 비율을 비슷하게 유지한다}, {id: scale-feature, text: 특성 스케일을 맞춘다}, {id: remove-class, text: 소수 클래스를 제거한다}, {id: tune-tree, text: 트리 깊이를 정한다}]
    correct_answers: [preserve-ratio]
    explanation: 각 split이 대표적인 클래스 비율을 갖도록 돕는다.
    source_ref: https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.train_test_split.html
  - id: regression-metric
    lesson_id: classification-and-regression
    skill_id: model-evaluation
    topic: 회귀 평가
    difficulty: 2
    type: single_choice
    prompt: 큰 오차에 더 큰 페널티를 주고 싶은 회귀 평가 지표는 무엇인가?
    options: [{id: rmse, text: RMSE}, {id: mae, text: MAE}, {id: accuracy, text: 정확도}, {id: recall, text: 재현율}]
    correct_answers: [rmse]
    explanation: RMSE는 제곱 후 평균하므로 큰 오차에 민감하다.
    source_ref: https://scikit-learn.org/stable/modules/model_evaluation.html
  - id: precision-recall-choice
    lesson_id: baseline-model-and-evaluation
    skill_id: model-evaluation
    topic: 분류 지표
    difficulty: 3
    type: single_choice
    prompt: 위험 고객을 놓치는 비용이 큰 탐지 문제에서 우선 살필 지표는 무엇인가?
    options: [{id: recall, text: 재현율(Recall)}, {id: accuracy, text: 정확도}, {id: r2, text: R²}, {id: mae, text: MAE}]
    correct_answers: [recall]
    explanation: 실제 양성 중 놓치지 않은 비율인 재현율이 핵심이다.
    source_ref: https://scikit-learn.org/stable/modules/model_evaluation.html
  - id: confusion-matrix-reading
    lesson_id: baseline-model-and-evaluation
    skill_id: model-evaluation
    topic: 혼동행렬
    difficulty: 2
    type: short_answer
    prompt: 실제 양성을 음성으로 예측한 오류를 무엇이라고 하는가?
    options: []
    correct_answers: [false-negative, fn, 거짓 음성]
    explanation: False Negative는 양성을 놓친 경우다.
    source_ref: https://scikit-learn.org/stable/modules/generated/sklearn.metrics.confusion_matrix.html
  - id: cross-validation-purpose
    lesson_id: baseline-model-and-evaluation
    skill_id: model-evaluation
    topic: 교차검증
    difficulty: 3
    type: single_choice
    prompt: 교차검증의 주된 목적은 무엇인가?
    options: [{id: estimate-generalization, text: 여러 학습·검증 분할에서 일반화 성능을 안정적으로 추정한다}, {id: add-labels, text: 레이블을 만든다}, {id: remove-test, text: 테스트 평가를 없앤다}, {id: guarantee-causality, text: 인과관계를 보장한다}]
    correct_answers: [estimate-generalization]
    explanation: 여러 fold의 성능 변동을 확인해 과적합 위험과 일반화 성능을 추정한다.
    source_ref: https://scikit-learn.org/stable/modules/cross_validation.html
  - id: neural-network-loss
    lesson_id: neural-network-simulation
    skill_id: deep-learning
    topic: 딥러닝 학습
    difficulty: 3
    type: single_choice
    prompt: 신경망 학습에서 손실 함수의 역할은 무엇인가?
    options: [{id: measure-error, text: 예측과 정답의 차이를 수치화해 파라미터 갱신 신호를 제공한다}, {id: load-csv, text: CSV를 읽는다}, {id: plot-only, text: 그래프만 그린다}, {id: split-only, text: 데이터를 분할한다}]
    correct_answers: [measure-error]
    explanation: 최적화기는 손실을 줄이는 방향으로 가중치를 업데이트한다.
    source_ref: lessons/pandas-basics-lab.md
  - id: overfit-curve
    lesson_id: neural-network-simulation
    skill_id: deep-learning
    topic: 과적합
    difficulty: 3
    type: single_choice
    prompt: 학습 손실은 계속 낮아지지만 검증 손실이 상승하기 시작했다. 가장 가능성 높은 해석은?
    options: [{id: overfit, text: 학습 데이터에 과적합되고 있다}, {id: underfit, text: 모델이 전혀 학습되지 않는다}, {id: no-data, text: 데이터가 없다}, {id: encoding, text: 인코딩만 필요하다}]
    correct_answers: [overfit]
    explanation: 학습·검증 곡선의 분리는 과적합 신호다.
    source_ref: lessons/pandas-basics-lab.md
  - id: pipeline-benefit
    lesson_id: leakage-and-reproducibility
    skill_id: ml-reproducibility
    topic: Pipeline
    difficulty: 3
    type: single_choice
    prompt: 전처리와 모델을 Pipeline으로 묶는 가장 큰 이점은 무엇인가?
    options: [{id: consistent-transform, text: 분할별 fit 경계를 일관되게 적용하고 재현하기 쉽다}, {id: automatic-causality, text: 인과관계를 증명한다}, {id: more-rows, text: 행을 늘린다}, {id: no-evaluation, text: 평가가 불필요해진다}]
    correct_answers: [consistent-transform]
    explanation: Pipeline은 변환과 모델 학습 순서를 고정해 누수와 실수 가능성을 낮춘다.
    source_ref: https://scikit-learn.org/stable/modules/compose.html
  - id: graph-purpose
    lesson_id: model-improvement-and-graphing
    skill_id: data-visualization
    topic: 결과 그래프
    difficulty: 2
