schema_version: 1
course_id: sqld
questions:
  - id: identify-order-entity
    lesson_id: data-modeling-foundations
    skill_id: data-modeling
    topic: 엔터티 식별
    difficulty: 2
    type: single_choice
    prompt: 다음 업무 문장에서 독립적으로 관리할 가능성이 가장 높은 엔터티는 무엇인가? “회원은 주문을 여러 건 만들고 각 주문에는 주문일과 상태가 있다.”
    options:
      - {id: order, text: 주문}
      - {id: order-date, text: 주문일}
      - {id: status, text: 상태}
      - {id: makes, text: 만든다}
    correct_answers: [order]
    explanation: 주문은 업무적으로 식별·관리되는 대상이고 주문일과 상태는 주문의 속성이다.
  - id: one-to-many-cardinality
    lesson_id: data-modeling-foundations
    skill_id: data-modeling
    topic: 관계 카디널리티
    difficulty: 2
    type: single_choice
    prompt: “한 회원은 여러 주문을 만들고, 한 주문은 한 회원에 속한다”의 관계 카디널리티는 무엇인가?
    options:
      - {id: one-to-many, text: "회원 1 : 주문 N"}
      - {id: one-to-one, text: "회원 1 : 주문 1"}
      - {id: many-to-many, text: "회원 N : 주문 N"}
      - {id: zero-only, text: "회원 0 : 주문 0"}
    correct_answers: [one-to-many]
    explanation: 회원 한 명에 여러 주문이 연결되고 주문 하나는 회원 하나에 연결되므로 1:N이다.
  - id: many-to-many-bridge
    lesson_id: data-modeling-foundations
    skill_id: data-modeling
    topic: 관계 해소
    difficulty: 3
    type: single_choice
    prompt: 주문과 상품이 서로 여러 개씩 연결되는 N:M 관계를 관계형 테이블로 표현할 때 일반적으로 필요한 것은 무엇인가?
    options:
      - {id: bridge-entity, text: 주문상품 같은 연결 엔터티}
      - {id: duplicate-column, text: 주문 테이블에 상품 열 하나만 추가}
      - {id: delete-product, text: 상품 엔터티를 제거}
      - {id: unrelated-table, text: 관계와 무관한 로그 테이블}
    correct_answers: [bridge-entity]
    explanation: 연결 엔터티의 각 행이 주문과 상품의 한 조합을 나타내며 수량 같은 관계 속성도 담을 수 있다.
  - id: normalization-update-anomaly
    lesson_id: data-modeling-foundations
    skill_id: data-modeling
    topic: 정규화와 이상
    difficulty: 3
    type: multiple_choice
    prompt: 정규화가 줄이려는 데이터 이상 현상으로 옳은 것을 모두 고르시오.
    options:
      - {id: insert-anomaly, text: 삽입 이상}
      - {id: update-anomaly, text: 갱신 이상}
      - {id: delete-anomaly, text: 삭제 이상}
      - {id: faster-query-always, text: 모든 조회가 항상 더 빨라지는 현상}
    correct_answers: [insert-anomaly, update-anomaly, delete-anomaly]
    explanation: 중복과 종속을 줄이면 삽입·갱신·삭제 이상이 줄어든다. 정규화가 모든 조회를 자동으로 빠르게 하지는 않는다.
    incorrect_explanations:
      faster-query-always: 테이블 분해는 조인을 늘려 일부 조회를 느리게 할 수 있다.
  - id: primary-key-property
    lesson_id: data-modeling-foundations
    skill_id: data-modeling
    topic: 식별자
    difficulty: 2
    type: multiple_choice
    prompt: 기본 식별자가 갖춰야 할 성질로 적절한 것을 모두 고르시오.
    options:
      - {id: unique, text: 각 인스턴스를 유일하게 구분한다}
      - {id: stable, text: 업무상 의미가 바뀌어도 가능한 한 안정적이다}
      - {id: nullable, text: 구분할 수 없어도 NULL을 허용한다}
      - {id: minimal, text: 식별에 필요한 최소 속성으로 구성한다}
    correct_answers: [unique, stable, minimal]
    explanation: 식별자는 유일성·최소성·안정성을 고려하며, 식별자가 NULL이면 인스턴스를 구분할 수 없다.
    incorrect_explanations:
      nullable: 기본 식별자는 식별을 위해 NULL이 될 수 없다.
  - id: conceptual-logical-physical-order
    lesson_id: data-modeling-foundations
    skill_id: data-modeling
    topic: 모델링 단계
    difficulty: 4
    type: single_choice
    prompt: 개념적 모델링 다음에 논리적 모델링, 그 다음 물리적 모델링을 수행하는 이유로 가장 적절한 것은 무엇인가?
    options:
      - {id: progressive-detail, text: 업무 의미를 먼저 합의하고 구조와 DBMS 제약을 단계적으로 구체화하기 위해서다}
      - {id: physical-first, text: 인덱스와 파티션을 먼저 정한 뒤 업무 요구를 맞추기 위해서다}
      - {id: skip-rules, text: 업무 규칙을 생략하고 테이블 수만 줄이기 위해서다}
      - {id: no-difference, text: 세 단계는 이름만 다르고 산출물과 목적은 같다}
    correct_answers: [progressive-detail]
    explanation: 추상화 수준을 단계적으로 낮추면 업무 의미와 구현 제약을 섞지 않고 추적 가능하게 설계할 수 있다.
    incorrect_explanations:
      physical-first: 물리 제약을 먼저 고정하면 업무 의미와 논리 구조가 구현에 끌려갈 수 있다.
      skip-rules: 모델링은 업무 규칙을 명시하고 추적하기 위한 과정이다.
      no-difference: 각 단계는 업무 개념, 논리 구조, 물리 구현이라는 서로 다른 목적을 가진다.
