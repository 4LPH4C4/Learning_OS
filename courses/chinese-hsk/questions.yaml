schema_version: 1
course_id: chinese-hsk
questions:
  - id: placement-beginner-tone-mark
    lesson_id: placement-diagnostic
    level: beginner
    sets: [placement]
    skill_id: chinese-pinyin
    topic: 입문 병음과 성조
    difficulty: 1
    type: single_choice
    prompt: "‘你好’의 표준 병음 표기로 가장 알맞은 것은?"
    options:
      - {id: ni-hao-third, text: "nǐ hǎo"}
      - {id: ni-hao-first, text: "nī hāo"}
      - {id: ni-hao-fourth, text: "nì hào"}
      - {id: ni-hao-no-tone, text: "ni hao"}
    correct_answers: [ni-hao-third]
    explanation: 你와 好의 사전 성조는 모두 3성이다. 실제 발화에서는 3성 변조가 일어나도 병음 표기는 nǐ hǎo로 쓴다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-beginner-thanks
    lesson_id: placement-diagnostic
    level: beginner
    sets: [placement]
    skill_id: chinese-vocabulary
    topic: 입문 생존 표현
    difficulty: 1
    type: single_choice
    prompt: "상대방에게 ‘고맙습니다’라고 말할 때 알맞은 표현은?"
    options:
      - {id: zaijian, text: "再见"}
      - {id: xiexie, text: "谢谢"}
      - {id: duibuqi, text: "对不起"}
      - {id: meiguanxi, text: "没关系"}
    correct_answers: [xiexie]
    explanation: 谢谢는 감사, 再见은 작별, 对不起는 사과, 没关系는 괜찮다는 응답이다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-beginner-pronouns
    lesson_id: placement-diagnostic
    level: beginner
    sets: [placement]
    skill_id: chinese-vocabulary
    topic: 입문 인칭 표현
    difficulty: 1
    type: single_choice
    prompt: "‘나는 학생입니다’에 해당하는 중국어 문장은?"
    options:
      - {id: ni-shi-xuesheng, text: "你是学生。"}
      - {id: wo-you-xuesheng, text: "我有学生。"}
      - {id: wo-shi-xuesheng, text: "我是学生。"}
      - {id: ta-zai-xuesheng, text: "他在学生。"}
    correct_answers: [wo-shi-xuesheng]
    explanation: 我는 나, 是는 신분이나 분류를 잇고, 学生은 학생이다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-beginner-number
    lesson_id: placement-diagnostic
    level: beginner
    sets: [placement]
    skill_id: chinese-vocabulary
    topic: 입문 숫자
    difficulty: 1
    type: single_choice
    prompt: "숫자 28을 중국어로 바르게 쓴 것은?"
    options:
      - {id: baershi, text: "八二十"}
      - {id: ershibaib, text: "二十八百"}
      - {id: liangba, text: "两八"}
      - {id: ershiba, text: "二十八"}
    correct_answers: [ershiba]
    explanation: 28은 2개의 십과 8이므로 二十八이라고 한다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-beginner-repair
    lesson_id: placement-diagnostic
    level: beginner
    sets: [placement]
    skill_id: chinese-communication
    topic: 입문 대화 수리
    difficulty: 1
    type: single_choice
    prompt: "상대방의 말을 못 알아들어 ‘다시 한 번 말해 주세요’라고 요청하려 한다. 가장 알맞은 표현은?"
    options:
      - {id: say-again, text: "请再说一遍。"}
      - {id: write-name, text: "请写名字。"}
      - {id: go-now, text: "现在去吧。"}
      - {id: no-need, text: "不用了。"}
    correct_answers: [say-again]
    explanation: 请再说一遍은 상대에게 같은 내용을 다시 말해 달라고 정중히 요청하는 표현이다.
    source_ref: https://www.chinesetest.cn/Development?lang=cn

  - id: placement-hsk1-word-order
    lesson_id: placement-diagnostic
    level: hsk1
    sets: [placement]
    skill_id: chinese-grammar
    topic: HSK 1 기본 어순
    difficulty: 1
    type: single_choice
    prompt: "‘나는 오늘 학교에서 중국어를 공부한다’의 가장 자연스러운 어순은?"
    options:
      - {id: verb-subject-place, text: "学习我在学校今天汉语。"}
      - {id: subject-time-place-verb, text: "我今天在学校学习汉语。"}
      - {id: object-time-subject, text: "汉语今天我学习在学校。"}
      - {id: place-object-verb, text: "在学校汉语学习我今天。"}
    correct_answers: [subject-time-place-verb]
    explanation: 기본적으로 주어 뒤에 시간과 장소가 오고, 이어 동사와 목적어가 온다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk1-you-zai
    lesson_id: placement-diagnostic
    level: hsk1
    sets: [placement]
    skill_id: chinese-grammar
    topic: HSK 1 존재와 위치
    difficulty: 1
    type: single_choice
    prompt: "빈칸에 알맞은 말은? 学校___一个图书馆。"
    options:
      - {id: zai, text: "在"}
      - {id: shi, text: "是"}
      - {id: you, text: "有"}
      - {id: qu, text: "去"}
    correct_answers: [you]
    explanation: 어떤 장소에 무엇이 존재한다고 말할 때 장소+有+대상을 쓴다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk1-measure-word
    lesson_id: placement-diagnostic
    level: hsk1
    sets: [placement]
    skill_id: chinese-vocabulary
    topic: HSK 1 양사
    difficulty: 1
    type: single_choice
    prompt: "‘책 두 권’의 자연스러운 표현은?"
    options:
      - {id: er-ge-shu, text: "二个书"}
      - {id: liang-zhang-shu, text: "两张书"}
      - {id: er-bei-shu, text: "二杯书"}
      - {id: liang-ben-shu, text: "两本书"}
    correct_answers: [liang-ben-shu]
    explanation: 책을 세는 대표 양사는 本이며 양사 앞의 둘은 흔히 两을 쓴다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk1-location
    lesson_id: placement-diagnostic
    level: hsk1
    sets: [placement]
    skill_id: chinese-reading
    topic: HSK 1 위치
    difficulty: 1
    type: single_choice
    prompt: "手机在包里。 이 문장이 뜻하는 것은?"
    options:
      - {id: phone-in-bag, text: "휴대전화가 가방 안에 있다."}
      - {id: bag-in-phone, text: "가방이 휴대전화 안에 있다."}
      - {id: take-phone-out, text: "휴대전화를 가방에서 꺼낸다."}
      - {id: buy-new-bag, text: "새 가방을 산다."}
    correct_answers: [phone-in-bag]
    explanation: A在B里는 A가 B 안에 있다는 위치 관계를 나타낸다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk1-shopping
    lesson_id: placement-diagnostic
    level: hsk1
    sets: [placement]
    skill_id: chinese-communication
    topic: HSK 1 구매 상황
    difficulty: 1
    type: single_choice
    prompt: "A: 这个多少钱？ B: 十五块。 두 사람은 무엇을 확인하고 있는가?"
    options:
      - {id: time, text: "시각"}
      - {id: price, text: "가격"}
      - {id: address, text: "주소"}
      - {id: name, text: "이름"}
    correct_answers: [price]
    explanation: 多少钱은 얼마인지 가격을 묻고, 十五块는 15위안이라는 구어적 답이다.
    source_ref: https://www.chinesetest.cn/syllabus

  - id: placement-hsk2-experience
    lesson_id: placement-diagnostic
    level: hsk2
    sets: [placement]
    skill_id: chinese-grammar
    topic: HSK 2 경험상
    difficulty: 2
    type: single_choice
    prompt: "‘나는 베이징에 가 본 적이 있다’에 알맞은 문장은?"
    options:
      - {id: zai-qu, text: "我在去北京。"}
      - {id: mei-qu-le, text: "我没去了北京。"}
      - {id: qu-guo, text: "我去过北京。"}
      - {id: shi-qu, text: "我是去北京。"}
    correct_answers: [qu-guo]
    explanation: 동사 뒤의 过는 과거의 경험이 있음을 나타낸다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk2-modal
    lesson_id: placement-diagnostic
    level: hsk2
    sets: [placement]
    skill_id: chinese-grammar
    topic: HSK 2 가능과 허가
    difficulty: 2
    type: single_choice
    prompt: "촬영 허가를 정중하게 물을 때 가장 알맞은 문장은?"
    options:
      - {id: hui-paizhao, text: "这里会拍照吗？"}
      - {id: shi-paizhao, text: "这里是拍照吗？"}
      - {id: you-paizhao, text: "这里有拍照吗？"}
      - {id: keyi-paizhao, text: "这里可以拍照吗？"}
    correct_answers: [keyi-paizhao]
    explanation: 可以…吗는 상황상 허용되는지 허가를 묻는 데 적합하다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk2-comparison
    lesson_id: placement-diagnostic
    level: hsk2
    sets: [placement]
    skill_id: chinese-grammar
    topic: HSK 2 비교
    difficulty: 2
    type: single_choice
    prompt: "‘오늘은 어제보다 춥다’의 자연스러운 표현은?"
    options:
      - {id: jintian-bi, text: "今天比昨天冷。"}
      - {id: zuotian-bi, text: "昨天比今天冷。"}
      - {id: jintian-bi-hen, text: "今天比昨天很冷。"}
      - {id: jintian-yiyang, text: "今天跟昨天一样冷。"}
    correct_answers: [jintian-bi]
    explanation: A比B+형용사는 A가 B보다 해당 성질의 정도가 높음을 나타낸다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk2-message
    lesson_id: placement-diagnostic
    level: hsk2
    sets: [placement]
    skill_id: chinese-reading
    topic: HSK 2 계획 변경
    difficulty: 2
    type: single_choice
    prompt: "王老师，我今天有点儿不舒服，不能来上课。明天我再给您打电话。 화자가 오늘 하려는 일은?"
    options:
      - {id: teach-class, text: "오늘 수업을 직접 진행한다."}
      - {id: miss-class, text: "수업에 가지 않고 선생님께 상황을 알린다."}
      - {id: travel-today, text: "오늘 여행을 떠난다."}
      - {id: call-yesterday, text: "어제 선생님께 전화한다."}
    correct_answers: [miss-class]
    explanation: 不舒服와 不能来上课가 오늘 결석함을, 明天再打电话가 다음 행동을 나타낸다.
    source_ref: https://www.chinesetest.cn/Development?lang=cn
  - id: placement-hsk2-progressive
    lesson_id: placement-diagnostic
    level: hsk2
    sets: [placement]
    skill_id: chinese-grammar
    topic: HSK 2 진행상
    difficulty: 2
    type: single_choice
    prompt: "전화를 받은 사람이 ‘지금 회의 중입니다’라고 말하려 한다. 가장 알맞은 문장은?"
    options:
      - {id: kaihui-guo, text: "我开会过。"}
      - {id: mei-kaihui-le, text: "我没开会了。"}
      - {id: zhengzai-kaihui, text: "我正在开会。"}
      - {id: bi-kaihui, text: "我比开会。"}
    correct_answers: [zhengzai-kaihui]
    explanation: 正在+동사는 말하는 시점에 동작이 진행 중임을 나타낸다.
    source_ref: https://www.chinesetest.cn/syllabus

  - id: placement-hsk3-result-complement
    lesson_id: placement-diagnostic
    level: hsk3
    sets: [placement]
    skill_id: chinese-grammar
    topic: HSK 3 결과 보어
    difficulty: 2
    type: single_choice
    prompt: "설명을 들었지만 이해하지 못했다는 뜻을 가장 정확히 나타낸 문장은?"
    options:
      - {id: mei-ting, text: "我没听，也懂了。"}
      - {id: ting-zai, text: "我听在了。"}
      - {id: dong-ting, text: "我懂听了。"}
      - {id: mei-tingdong, text: "我听了，但是没听懂。"}
    correct_answers: [mei-tingdong]
    explanation: 听은 듣는 행동, 听懂은 들어서 이해한 결과다. 没听懂은 그 결과에 이르지 못했음을 뜻한다.
    source_ref: https://www.chinesetest.cn/HSK/3
  - id: placement-hsk3-ba-construction
    lesson_id: placement-diagnostic
    level: hsk3
    sets: [placement]
    skill_id: chinese-grammar
    topic: HSK 3 把자문
    difficulty: 2
    type: single_choice
    prompt: "‘이 책을 다 읽었다’에서 대상의 처리 결과를 강조하는 자연스러운 문장은?"
    options:
      - {id: ba-kanwan, text: "我把这本书看完了。"}
      - {id: ba-kan, text: "我把一本书看。"}
      - {id: shu-ba, text: "这本书把我看完了。"}
      - {id: bei-kan, text: "我被这本书看完了。"}
    correct_answers: [ba-kanwan]
    explanation: 把 뒤에는 특정 목적어가 오며 동사 뒤의 看完이 읽기를 마친 결과를 나타낸다.
    source_ref: https://www.chinesetest.cn/HSK/3
  - id: placement-hsk3-direction
    lesson_id: placement-diagnostic
    level: hsk3
    sets: [placement]
    skill_id: chinese-grammar
    topic: HSK 3 방향 보어
    difficulty: 2
    type: single_choice
    prompt: "화자가 방 안에 있으며 밖의 사람에게 ‘들어오세요’라고 말한다. 알맞은 표현은?"
    options:
      - {id: jinqu, text: "请进去。"}
      - {id: jinlai, text: "请进来。"}
      - {id: chulai, text: "请出来。"}
      - {id: chuqu, text: "请出去。"}
    correct_answers: [jinlai]
    explanation: 进은 안으로, 来는 화자 또는 기준점 쪽으로 이동함을 나타낸다.
    source_ref: https://www.chinesetest.cn/HSK/3
  - id: placement-hsk3-notice
    lesson_id: placement-diagnostic
    level: hsk3
    sets: [placement]
    skill_id: chinese-reading
    topic: HSK 3 공지 독해
    difficulty: 2
    type: single_choice
    prompt: "通知：星期日上午图书馆不开门，下午两点正常开放。 이 공지를 바르게 이해한 것은?"
    options:
      - {id: closed-all-day, text: "일요일 하루 종일 문을 닫는다."}
      - {id: opens-morning, text: "일요일 오전에만 연다."}
      - {id: opens-two, text: "일요일 오후 2시에는 정상적으로 연다."}
      - {id: opens-monday, text: "월요일 오후 2시에만 연다."}
    correct_answers: [opens-two]
    explanation: 上午不开门은 오전 휴관, 下午两点正常开放은 오후 2시 정상 개관이라는 뜻이다.
    source_ref: https://www.chinesetest.cn/HSK/3
  - id: placement-hsk3-cai-sequence
    lesson_id: placement-diagnostic
    level: hsk3
    sets: [placement]
    skill_id: chinese-reading
    topic: HSK 3 사건 순서
    difficulty: 2
    type: single_choice
    prompt: "小李到了公司才发现没带电脑。 무엇이 먼저 일어났는가?"
    options:
      - {id: discover-first, text: "컴퓨터를 안 가져온 사실을 먼저 발견했다."}
      - {id: buy-first, text: "새 컴퓨터를 먼저 샀다."}
      - {id: return-first, text: "집으로 먼저 돌아갔다."}
      - {id: arrive-first, text: "회사에 도착했다."}
    correct_answers: [arrive-first]
    explanation: 到了公司才发现은 회사에 도착한 뒤에야 비로소 발견했다는 사건 순서를 나타낸다.
    source_ref: https://www.chinesetest.cn/HSK/3

  - id: placement-hsk4-condition
    lesson_id: placement-diagnostic
    level: hsk4
    sets: [placement]
    skill_id: chinese-grammar
    topic: HSK 4 조건 복문
    difficulty: 3
    type: single_choice
    prompt: "‘사용자 요구를 이해해야만 문제를 해결할 수 있다’의 필요조건을 정확히 나타낸 문장은?"
    options:
      - {id: zhiyou-cai, text: "只有了解用户需求，才能解决问题。"}
      - {id: zhiyao-jiu, text: "只要了解用户需求，就一定解决了问题。"}
      - {id: suiran-danshi, text: "虽然了解用户需求，但是解决问题。"}
      - {id: yibian-yibian, text: "一边了解用户需求，一边才问题。"}
    correct_answers: [zhiyou-cai]
    explanation: 只有A才B는 B가 성립하려면 A가 필요하다는 필요조건을 나타낸다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk4-passive
    lesson_id: placement-diagnostic
    level: hsk4
    sets: [placement]
    skill_id: chinese-grammar
    topic: HSK 4 피동
    difficulty: 3
    type: single_choice
    prompt: "회의가 취소됐다는 결과를 중심으로 가장 자연스럽게 말한 문장은?"
    options:
      - {id: huiyi-bei-quxiao-ren, text: "会议被取消人了。"}
      - {id: huiyi-quxiao, text: "会议被取消了。"}
      - {id: huiyi-ba-quxiao, text: "会议把取消了。"}
      - {id: quxiao-bei-huiyi, text: "取消被会议了。"}
    correct_answers: [huiyi-quxiao]
    explanation: 영향을 받은 대상 会议를 주제로 삼고 행위자를 생략한 被자문이 자연스럽다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk4-concession
    lesson_id: placement-diagnostic
    level: hsk4
    sets: [placement]
    skill_id: chinese-grammar
    topic: HSK 4 양보 복문
    difficulty: 3
    type: single_choice
    prompt: "빈칸의 짝으로 가장 알맞은 것은? ___时间很紧，___我们还是完成了任务。"
    options:
      - {id: yinwei-suoyi, text: "因为 / 所以"}
      - {id: zhiyou-cai, text: "只有 / 才"}
      - {id: suiran-danshi, text: "虽然 / 但是"}
      - {id: yibian-yibian, text: "一边 / 一边"}
    correct_answers: [suiran-danshi]
    explanation: 시간이 빠듯했는데도 과제를 완수했다는 기대와 반대되는 결과이므로 양보 관계다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk4-request-email
    lesson_id: placement-diagnostic
    level: hsk4
    sets: [placement]
    skill_id: chinese-communication
    topic: HSK 4 업무 요청
