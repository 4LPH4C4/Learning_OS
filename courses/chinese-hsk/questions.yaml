    options:
      - {id: immediate-approval, text: "조건 없이 즉시 시행을 강하게 지지한다."}
      - {id: reserved-support, text: "장점은 인정하지만 현재 시행에는 유보적이다."}
      - {id: no-merit, text: "어떤 장점도 없다고 단언한다."}
      - {id: conditions-ready, text: "시행 조건이 완전히 갖춰졌다고 본다."}
    correct_answers: [reserved-support]
    explanation: 이중부정으로 장점을 제한적으로 인정한 뒤 不过와 条件还不成熟로 현재 시행을 유보한다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk8-synthesis-conflict
    lesson_id: placement-diagnostic
    level: hsk8
    sets: [placement]
    skill_id: chinese-reading
    topic: HSK 8 자료 종합
    difficulty: 5
    type: single_choice
    prompt: "보고서 A는 대기업에서 원격근무 생산성이 올랐다고 하고, 보고서 B는 신입사원의 협업 학습이 낮아졌다고 한다. 가장 좋은 종합은?"
    options:
      - {id: a-cancels-b, text: "A가 맞으므로 B의 관찰은 자동으로 거짓이다."}
      - {id: b-proves-all, text: "B만으로 모든 직원에게 원격근무가 해롭다고 확정한다."}
      - {id: conditional-synthesis, text: "원격근무의 효과는 조직 규모와 경력·과업에 따라 달라질 수 있어 조건별 설계가 필요하다."}
      - {id: simple-average, text: "두 보고서의 문장 수를 평균내 결론을 정한다."}
    correct_answers: [conditional-synthesis]
    explanation: 두 결과의 대상과 측정 결과가 달라 모순으로만 보지 않고 효과가 달라지는 조건을 도출한다.
    source_ref: https://www.chinesetest.cn/Development?lang=cn
  - id: placement-hsk8-framing
    lesson_id: placement-diagnostic
    level: hsk8
    sets: [placement]
    skill_id: chinese-vocabulary
    topic: HSK 8 프레이밍
    difficulty: 5
    type: single_choice
    prompt: "같은 예산 변화를 ‘优化支出结构’와 ‘削减公共服务’로 표현할 때 가장 적절한 분석은?"
    options:
      - {id: identical-neutral, text: "두 표현은 언제나 완전히 중립적이고 함의가 같다."}
      - {id: first-always-true, text: "첫 표현을 쓰면 정책이 항상 성공했다는 사실이 된다."}
      - {id: second-no-attitude, text: "削减은 평가나 관점과 전혀 관계가 없다."}
      - {id: different-framing, text: "첫 표현은 효율적 조정을, 둘째는 서비스 손실을 부각해 서로 다른 평가 틀을 만든다."}
    correct_answers: [different-framing]
    explanation: 단어 선택은 같은 변화의 효율성과 손실 중 무엇을 전면에 놓는지 달리해 독자의 평가를 유도한다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk8-counterargument
    lesson_id: placement-diagnostic
    level: hsk8
    sets: [placement]
    skill_id: chinese-writing
    topic: HSK 8 설득 논증
    difficulty: 5
    type: single_choice
    prompt: "설득문에서 강한 반론을 가장 공정하고 효과적으로 다루는 방법은?"
    options:
      - {id: steelman-and-answer, text: "반론의 조건과 근거를 정확히 재진술하고 내 제안이 그 위험을 줄이는 방식을 설명한다."}
      - {id: distort, text: "반론을 더 약하고 우스운 주장으로 바꿔 공격한다."}
      - {id: omit, text: "내 결론에 불리한 자료는 출처와 함께 모두 삭제한다."}
      - {id: insult, text: "반론을 낸 사람의 동기를 공격하고 내용에는 답하지 않는다."}
    correct_answers: [steelman-and-answer]
    explanation: 강한 반론을 정확히 다루면 논증의 적용 조건과 완화책을 검증할 수 있다.
    source_ref: https://www.chinesetest.cn/Development?lang=cn

  - id: placement-hsk9-domain-term
    lesson_id: placement-diagnostic
    level: hsk9
    sets: [placement]
    skill_id: chinese-reading
    topic: HSK 9 분야 횡단 의미
    difficulty: 5
    type: single_choice
    prompt: "서로 다른 전문 글에서 ‘治理’가 등장했다. 가장 신뢰할 수 있는 해석 절차는?"
    options:
      - {id: one-korean-word, text: "첫 사전 번역 하나를 모든 분야에 그대로 대입한다."}
      - {id: define-in-context, text: "각 글의 정의, 행위 주체, 대상, 측정 방식을 확인한 뒤 공통점과 차이를 명시한다."}
      - {id: ignore-context, text: "앞뒤 문맥을 읽지 않고 글자 모양만으로 확정한다."}
      - {id: assume-identical, text: "두 글의 용법은 반드시 완전히 같다고 가정한다."}
    correct_answers: [define-in-context]
    explanation: 전문 용어는 분야별 범위가 다르므로 텍스트 내부 정의와 운용 방식을 먼저 확인해야 한다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk9-cultural-idiom
    lesson_id: placement-diagnostic
    level: hsk9
    sets: [placement]
    skill_id: chinese-reading
    topic: HSK 9 문화적 함의
    difficulty: 5
    type: single_choice
    prompt: "정책 문맥에서 ‘摸着石头过河’를 해석하는 가장 적절한 접근은?"
    options:
      - {id: literal-only, text: "실제로 돌을 만지며 강을 건너는 동작만 뜻한다고 본다."}
      - {id: fixed-failure, text: "모든 정책이 실패했다는 고정된 뜻으로 본다."}
      - {id: gradual-experiment, text: "점진적으로 시험하고 경험에 따라 조정한다는 비유로 읽되 해당 문맥의 정책 대상을 확인한다."}
      - {id: no-context-needed, text: "역사적·담화적 배경은 어떤 경우에도 확인하지 않는다."}
    correct_answers: [gradual-experiment]
    explanation: 표현의 비유적 핵심을 파악하면서도 실제 문맥의 대상과 발화 목적을 함께 확인해야 한다.
    source_ref: https://www.chinesetest.cn/syllabus
  - id: placement-hsk9-purposeful-interpretation
    lesson_id: placement-diagnostic
    level: hsk9
    sets: [placement]
    skill_id: chinese-communication
    topic: HSK 9 목적별 해석
    difficulty: 5
    type: single_choice
    prompt: "같은 전문 문단을 일반 시민용 안내문으로 바꿀 때 가장 적절한 원칙은?"
    options:
      - {id: remove-conditions, text: "읽기 쉽도록 모든 조건과 예외를 삭제한다."}
      - {id: add-certainty, text: "원문이 추정한 내용도 확정된 사실로 바꾼다."}
      - {id: copy-jargon, text: "독자의 배경과 상관없이 전문용어를 설명 없이 모두 복사한다."}
      - {id: preserve-and-explain, text: "조건과 핵심 개념은 보존하되 전문용어를 설명하고 독자가 취할 행동을 명확히 한다."}
    correct_answers: [preserve-and-explain]
    explanation: 산출물 목적에 맞게 표현을 풀어도 원문의 조건, 확실성, 핵심 관계는 보존해야 한다.
    source_ref: https://www.chinesetest.cn/Development?lang=cn
  - id: placement-hsk9-source-triangulation
    lesson_id: placement-diagnostic
    level: hsk9
    sets: [placement]
    skill_id: chinese-reading
    topic: HSK 9 자료 삼각검증
    difficulty: 5
    type: single_choice
    prompt: "기사 세 편이 모두 같은 통계를 인용하지만 최초 출처는 하나의 기관 보고서다. 가장 정확한 판단은?"
    options:
      - {id: one-underlying-source, text: "표면상 세 기사여도 핵심 수치의 독립된 원천은 하나이므로 원보고서를 검토해야 한다."}
      - {id: three-independent, text: "기사가 세 편이므로 자동으로 독립된 증거 세 개다."}
      - {id: no-source-needed, text: "수치가 반복되면 최초 출처와 방법은 확인할 필요가 없다."}
      - {id: majority-proves, text: "다수 기사에 실렸으므로 인과관계까지 증명된다."}
    correct_answers: [one-underlying-source]
    explanation: 같은 원천을 반복 인용한 자료는 독립적인 삼각검증이 아니며 원보고서의 방법과 범위를 확인해야 한다.
    source_ref: https://www.chinesetest.cn/Development?lang=cn
  - id: placement-hsk9-nuanced-policy
    lesson_id: placement-diagnostic
    level: hsk9
    sets: [placement]
    skill_id: chinese-reading
    topic: HSK 9 정교한 논지
    difficulty: 5
    type: single_choice
    prompt: "技术并非天然中立，但这也不意味着其社会后果在设计完成时就已注定。制度、使用方式与利益分配会持续重塑其影响。 필자의 관점은?"
    options:
      - {id: neutral-fixed, text: "기술은 완전히 중립이며 사회적 영향이 없다."}
      - {id: socio-technical, text: "기술은 가치와 무관하지 않지만 그 결과는 제도와 사용 과정에서 계속 형성된다."}
      - {id: fully-determined, text: "모든 결과는 설계가 끝날 때 영원히 확정된다."}
      - {id: institutions-irrelevant, text: "제도와 이익 배분은 기술 영향에 아무 역할도 하지 않는다."}
    correct_answers: [socio-technical]
    explanation: 필자는 기술의 비중립성과 결과의 비결정성을 동시에 주장하며 제도·사용·분배의 지속적 역할을 강조한다.
    source_ref: https://www.chinesetest.cn/syllabus
