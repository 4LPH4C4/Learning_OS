        content_path: lessons/hsk8-rhetoric-implication.md
        language: ko
        required: true
        skills: [chinese-reading, chinese-grammar]
      - id: hsk8-synthesis-writing
        title: 다중 자료 종합과 설득 글쓰기
        level: hsk8
        type: markdown
        duration_minutes: 80
        content_path: lessons/hsk8-synthesis-writing.md
        language: ko
        required: true
        skills: [chinese-reading, chinese-writing]
  - id: hsk9-mastery
    title: HSK 9 — 정교한 언어 수행
    order: 10
    lessons:
      - id: hsk9-crossdomain-interpretation
        title: 분야 횡단 해석과 문화적 전제
