  options:
  - id: a
    text: 이전 파일을 그대로 보내고 문제가 생기면 묻는다. — 이 판단을 이번 업무의 공식 실행 원칙으로 정한다.
  - id: b
    text: 화려한 형식으로 밤새 만든다. — 이 판단을 관련 부서와 협력사가 함께 따를 이번 분기 실행 원칙으로 정한다.
  - id: c
    text: 수신자, 포함 항목, 완료 기준과 정확한 기한이 무엇인지 확인한다. — 이 판단을 실행 원칙으로 정한다.
