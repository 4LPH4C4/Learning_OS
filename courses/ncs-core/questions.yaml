    c: 이 선택지는 핵심 조건을 충족하지 않는다. 수신자의 사전지식과 행동 목적, 사용 맥락에 맞춰 구조와 용어를 조정해야 한다.
    d: 이 선택지는 핵심 조건을 충족하지 않는다. 수신자의 사전지식과 행동 목적, 사용 맥락에 맞춰 구조와 용어를 조정해야 한다.
  source_ref: https://www.ncs.go.kr/unity/th03/TH0308.do
