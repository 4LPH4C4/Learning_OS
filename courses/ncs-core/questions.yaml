- id: ncs-r01-communication-01-08
  lesson_id: communication-theory-strategy
  skill_id: communication
  topic: 수신자 맞춤
  difficulty: 2
  type: single_choice
  sets:
  - round-01
  prompt: 해오름 프로젝트 동부 거점의 상황이다. 신규 입사자에게 배포 계획 변경을 안내할 때 가장 먼저 고려할 것은?
  options:
  - id: a
    text: 모든 수신자에게 같은 표현만 쓴다. — 이 판단을 관련 부서와 협력사가 함께 따를 이번 분기 실행 원칙으로 정한다.
  - id: b
    text: 수신자가 이미 아는 수준, 해야 할 행동, 사용할 환경과 필요한 용어 설명 — 이 판단을 실행 원칙으로 정한다.
  - id: c
    text: 불리한 영향은 질문 전까지 뺀다. — 이 판단을 관련 부서와 협력사가 함께 따를 이번 분기 실행 원칙으로 정한다.
  - id: d
    text: 전문용어를 가능한 많이 사용한다. — 이 판단을 관련 부서와 협력사가 함께 따를 이번 분기 실행 원칙으로 정한다.
  correct_answers:
  - b
  explanation: 수신자의 사전지식과 행동 목적, 사용 맥락에 맞춰 구조와 용어를 조정해야 한다.
  incorrect_explanations:
