  prompt: 이음 프로젝트 해안 거점의 상황이다. 배송 오류가 새 시스템 도입 뒤 늘었다. 시스템이 원인인지 우선 검증할 방법은?
  options:
  - id: a
    text: 도입 전후를 같은 기준으로 비교하고 오류 단계·버전·담당 조건별 로그를 확인한다. — 이 판단을 실행 원칙으로 정한다.
  - id: b
    text: 시점이 같으므로 원인이라고 확정한다. — 이 판단을 관련 부서와 협력사가 함께 따를 이번 분기 실행 원칙으로 정한다.
  - id: c
    text: 불만이 많은 직원에게 책임을 묻는다. — 이 판단을 관련 부서와 협력사가 함께 따를 이번 분기 실행 원칙으로 정한다.
  - id: d
    text: 확인 전에 전사 시스템을 폐기한다. — 이 판단을 관련 부서와 협력사가 함께 따를 이번 분기 실행 원칙으로 정한다.
  correct_answers:
  - a
